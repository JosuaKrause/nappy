# Builds the Web export and publishes it to GitHub Pages, which is already on for this repo with
# the custom domain https://nappy.josuakrause.com/ set as a repository setting — nothing here
# may write to that setting, and nothing in the export may assume a `/nappy/` path prefix, since
# the site is served from the domain's root rather than from a project-pages subpath.
#
# The Godot binary is installed and cached the same way tools/ci.yml does it, so there is one
# recipe for "get this exact Godot onto a runner" rather than two. Export templates are the
# second half of the same version pin: a template set that does not match the binary's own
# version is the failure that looks like a broken export rather than like a missing download.
name: deploy

on:
  push:
    tags: ['v*']

# The two permissions actions/deploy-pages needs; contents: read is the checkout's own default
# made explicit rather than inherited.
permissions:
  contents: read
  pages: write
  id-token: write

# A deploy that starts before the last one finished would race it for the same Pages slot; queue
# rather than cancel, since a half-published site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o ~/godot/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q ~/godot/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot-bin
          chmod +x ~/godot/godot-bin

      - name: Cache export templates
        id: templates-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-templates-${{ env.GODOT_VERSION }}

      - name: Download export templates
        if: steps.templates-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          curl -sSL -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          rm -rf /tmp/templates
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      # **The gate runs here rather than being inherited from `ci.yml`.** `ci.yml` has no branch or
      # tag filter, so it fires on a version tag too, and neither workflow waits for the other — a
      # deploy that trusted CI would publish a red build to a public address as often as not. A tag
      # can point at any commit, so that reasoning holds exactly as it did when this ran on every
      # push to `main`. Running it again costs a few minutes on the rare push of a version tag, and
      # it is the same gate this project requires before a commit: the project boots, and the full
      # suite is green.
      - name: Check
        run: GODOT="$HOME/godot/godot-bin" ./tools/check.sh

      - name: Test
        run: GODOT="$HOME/godot/godot-bin" ./tools/test.sh

      # Godot's own version mechanism -- `application/config/version`, read at runtime with
      # `ProjectSettings.get_setting` -- baked into the export rather than shipped beside it as a
      # file, which is what the milestone that added this step asked after: "unless godot already
      # has a mechanism for that". `github.ref_name` on a tag push is the tag itself (e.g.
      # "v1.2.3"), the same shape `tools/release.sh` writes, so `TitleScreen`'s fallback --
      # `ProjectSettings.get_setting("application/config/version")`, read where
      # `Telemetry.source_version()` has no repository to ask -- names the actual release rather
      # than the placeholder `project.godot` carries in the repository.
      - name: Write the release version into the export
        run: sed -i "s/^config\/version=.*/config\/version=\"${GITHUB_REF_NAME}\"/" project.godot

      - name: Export the Web build
        run: GODOT="$HOME/godot/godot-bin" ./tools/export-web.sh

      # The Web export packs everything under assets/ into the .pck, so nothing there is served
      # as a loose file. og:image in export_presets.cfg's html/head_include points at
      # social-card.png beside index.html, and this is what puts it there — the wordmark at
      # assets/logo.png, published under the name the head markup already expects.
      - name: Publish the social card image
        run: cp assets/logo.png build/web/social-card.png

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
