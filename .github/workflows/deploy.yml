# Builds the Web export and publishes it to GitHub Pages, which is already on for this repo with
# the custom domain https://nappy.josuakrause.com/ set as a repository setting — nothing here
# may write to that setting, and nothing in the export may assume a `/nappy/` path prefix, since
# the site is served from the domain's root rather than from a project-pages subpath.
#
# The Godot binary is installed and cached the same way tools/ci.yml does it, so there is one
# recipe for "get this exact Godot onto a runner" rather than two. Export templates are the
# second half of the same version pin: a template set that does not match the binary's own
# version is the failure that looks like a broken export rather than like a missing download.
name: deploy

on:
  push:
    tags: ['v*']

# The two permissions actions/deploy-pages needs; contents: read is the checkout's own default
# made explicit rather than inherited; checks: read is what `verify` needs to ask the API how
# the tagged commit's `test` check went.
permissions:
  contents: read
  checks: read
  pages: write
  id-token: write

# A deploy that starts before the last one finished would race it for the same Pages slot; queue
# rather than cancel, since a half-published site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2

jobs:
  # **The suite is not run again here; the tagged commit's own `test` check is what gates the
  # deploy.** `ci.yml` runs the full suite on every push to `main` and every pull request and
  # registers a check named `test` on the commit. Actions has no `needs` across workflows, so
  # this job is that dependency: it asks the API for every check run named `test` on the tagged
  # commit, waits while one is still running, and fails the deploy unless all of them completed
  # well -- `build` cannot start without it. A commit can carry more than one such run (a push
  # run and a pull-request run), and "none" is a failure too: a tag on a commit CI never saw is
  # not deployed. The `version tags` ruleset requires the same check before a `v*` tag can be
  # pushed at all, so this job is the workflow's own copy of that guarantee rather than a
  # substitute for it; `tools/release.sh` reads the same check before tagging as a courtesy to
  # the operator, and nothing here trusts that script.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: The tagged commit's test check is green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          waited=0
          while :; do
            state="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" --jq '
                [.check_runs[] | select(.name == "test")] as $t
                | if ($t | length) == 0 then "none"
                  elif ($t | any(.status == "completed" and
                        ((.conclusion == "success" or .conclusion == "neutral"
                          or .conclusion == "skipped") | not))) then "failure"
                  elif ($t | all(.status == "completed")) then "success"
                  else "pending" end')"
            echo "test check on ${GITHUB_SHA}: ${state} (${waited}s)"
            case "$state" in
              success) exit 0 ;;
              pending) ;;
              *) echo "refusing to deploy a commit whose test check is '${state}'" >&2; exit 1 ;;
            esac
            if (( waited >= 1500 )); then
              echo "the test check was still pending after ${waited}s" >&2
              exit 1
            fi
            sleep 30
            waited=$(( waited + 30 ))
          done

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o ~/godot/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q ~/godot/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot-bin
          chmod +x ~/godot/godot-bin

      - name: Cache export templates
        id: templates-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-templates-${{ env.GODOT_VERSION }}

      - name: Download export templates
        if: steps.templates-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          curl -sSL -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          rm -rf /tmp/templates
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      # The boot check stays: it is seconds, and its import pass is what leaves the project's
      # resources imported on a fresh runner before the export reads them. The suite does not run
      # here -- see `verify` above.
      - name: Check
        run: GODOT="$HOME/godot/godot-bin" ./tools/check.sh

      # RELEASE_TAG does two jobs in tools/export-web.sh, and github.ref_name on a tag push is the
      # tag itself (e.g. "v1.2.3"), the same shape tools/release.sh writes. It names the
      # build/web/<tag>/ directory index.js, index.wasm and index.pck move into, so their URLs
      # change with every release and GitHub Pages' Cache-Control: max-age=600 — which nothing in
      # this repo can turn off — can no longer serve a stale or, worse, mixed build inside that
      # window (docs/playtests/PLAYTEST-27.md finding 1). And it is the version the script bakes
      # into the export as `application/config/version`, beside HEAD's hash as
      # `application/config/source_commit` -- Godot's own settings mechanism, read at runtime by
      # `TitleScreen.version_text()` and `commit_text()` where an export has no repository to ask
      # -- so the page names the actual release rather than the placeholder project.godot carries
      # in the repository. The script, not a step here, does the writing, so a local export is
      # stamped the same way; this checkout is shallow, which is why the tag is passed in rather
      # than asked of `git describe`.
      - name: Export the Web build
        run: GODOT="$HOME/godot/godot-bin" RELEASE_TAG="$GITHUB_REF_NAME" ./tools/export-web.sh

      # The Web export packs everything under assets/ into the .pck, so nothing there is served
      # as a loose file. og:image/twitter:image in export_presets.cfg's html/head_include point
      # at social-card.png beside index.html, and this is what puts it there — assets/social-card.png,
      # a copy of the assets/logo.png wordmark already flattened onto an opaque background
      # (docs/playtests/PLAYTEST-27.md finding 5: logo.png's transparent pixels carry RGB (0,0,0), so a
      # client that ignores alpha paints the card black rather than showing nothing). Copied
      # rather than flattened here so the workflow needs no image-processing tool of its own.
      - name: Publish the social card image
        run: cp assets/social-card.png build/web/social-card.png

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
