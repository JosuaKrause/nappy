# Builds the Web export and publishes it to GitHub Pages, which is already on for this repo with
# the custom domain https://nappy.josuakrause.com/ set as a repository setting — nothing here
# may write to that setting, and nothing in the export may assume a `/nappy/` path prefix, since
# the site is served from the domain's root rather than from a project-pages subpath.
#
# The Godot binary, the custom Web template, the export and the browser check come from
# .github/actions/web-browser-check, the one recipe ci.yml's `browser` job and web-template.yml
# run too. The Godot version is tools/web-template/pins.env's, the pin the template is built
# against: a template that does not match the binary's own version is the failure that looks like
# a broken export rather than like a missing download.
name: deploy

on:
  push:
    tags: ['v*']

# Shared read permissions: contents is the checkout's own default made explicit rather than
# inherited; checks is what `verify` needs to ask the API how the tagged commit's `test` check
# went. Pages publication permissions belong only to the job that publishes.
permissions:
  contents: read
  checks: read

# A deploy that starts before the last one finished would race it for the same Pages slot; queue
# rather than cancel, since a half-published site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # **The suite is not run again here; the tagged commit's own `test` check is what gates the
  # deploy.** `ci.yml` runs the full suite and the browser check on every push to `main` and every
  # pull request and registers a check named `test` on the commit. Actions has no `needs` across workflows, so
  # this job is that dependency: it asks the API for every check run named `test` on the tagged
  # commit, waits while one is still running, and fails the deploy unless all of them completed
  # well -- `build` cannot start without it. A commit can carry more than one such run (a push
  # run and a pull-request run), and "none" is a failure too: a tag on a commit CI never saw is
  # not deployed. The `version tags` ruleset requires the same check before a `v*` tag can be
  # pushed at all, so this job is the workflow's own copy of that guarantee rather than a
  # substitute for it; `tools/release.sh` reads the same check before tagging as a courtesy to
  # the operator, and nothing here trusts that script.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: The tagged commit's test check is green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          waited=0
          while :; do
            state="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" --jq '
                [.check_runs[] | select(.name == "test")] as $t
                | if ($t | length) == 0 then "none"
                  elif ($t | any(.status == "completed" and
                        ((.conclusion == "success" or .conclusion == "neutral"
                          or .conclusion == "skipped") | not))) then "failure"
                  elif ($t | all(.status == "completed")) then "success"
                  else "pending" end')"
            echo "test check on ${GITHUB_SHA}: ${state} (${waited}s)"
            case "$state" in
              success) exit 0 ;;
              pending) ;;
              *) echo "refusing to deploy a commit whose test check is '${state}'" >&2; exit 1 ;;
            esac
            if (( waited >= 1500 )); then
              echo "the test check was still pending after ${waited}s" >&2
              exit 1
            fi
            sleep 30
            waited=$(( waited + 30 ))
          done

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # Same partial clone and sparse checkout as ci.yml's `shards` job: the boot check and the
      # Web export read nothing under docs/evidence/ (docs/ carries a .gdignore, so the import
      # pass never sees it either). docs/DECISIONS.md, M201, a CI job does not download the evidence.
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/evidence/

      # The template, the boot check, the export and the browser check are the same recipe ci.yml's
      # `browser` job runs on every code pull request and every push to main
      # (.github/actions/web-browser-check), so the commit whose `test` check passed was exported
      # and played in Chrome exactly this way before it could be tagged.
      #
      # RELEASE_TAG does two jobs in tools/export-web.sh, and github.ref_name on a tag push is the
      # tag itself (e.g. "v1.2.3"), the same shape tools/release.sh writes. It names the
      # build/web/<tag>/ directory index.js, index.wasm and index.pck move into, so their URLs
      # change with every release and GitHub Pages' Cache-Control: max-age=600 — which nothing in
      # this repo can turn off — can no longer serve a stale or, worse, mixed build inside that
      # window (docs/playtests/PLAYTEST-27.md finding 1). And it is the version the script bakes
      # into the export as `application/config/version`, beside HEAD's hash as
      # `application/config/source_commit` -- Godot's own settings mechanism, read at runtime by
      # `TitleScreen.version_text()` and `commit_text()` where an export has no repository to ask
      # -- so the page names the actual release rather than the placeholder project.godot carries
      # in the repository.
      - name: Export the Web build and verify it in Chrome before publishing
        uses: ./.github/actions/web-browser-check
        with:
          release-tag: ${{ github.ref_name }}

      - name: Keep browser verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-web-browser
          path: ${{ runner.temp }}/browser-result
          if-no-files-found: warn

      # og:image/twitter:image in export_presets.cfg's html/head_include point at
      # social-card.png beside index.html, and this is what puts it there — art/social-card.png,
      # a copy of the art/logo.png wordmark already flattened onto an opaque background
      # (docs/playtests/PLAYTEST-27.md finding 5: logo.png's transparent pixels carry RGB (0,0,0), so a
      # client that ignores alpha paints the card black rather than showing nothing). Copied
      # rather than flattened here so the workflow needs no image-processing tool of its own.
      # It has to be copied at all because art/ carries a .gdignore: the export never sees it, so
      # the card is not in the .pck and could not be served out of one anyway.
      - name: Publish the social card image
        run: cp art/social-card.png build/web/social-card.png

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # The native form of a release: a GitHub Release on the tag, published only once the site
  # itself is live, from `tools/release-notes.py` -- deterministic from git alone, no model and
  # no network call to compute. `contents: write` is scoped to this job alone; the workflow-level
  # permissions above stay exactly as narrow as they were before this job existed.
  release:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Full history and every tag, unlike `build`'s partial clone above: tools/release-notes.py's
      # own `git tag --merged` and `git log --first-parent` walk back through every earlier
      # release tag and every commit between them, not just the one this workflow tagged.
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 0
          fetch-tags: true

      # The runner image's own python3 is not the pinned toolchain -- python-tooling pins Python
      # 3.14 and runs every repository script through `uv run python`, the same as ci.yml's
      # `gates` job does for its own Python steps.
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Compute the release notes
        run: uv run --quiet python tools/release-notes.py "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /tmp/release-notes.md

      # Idempotent: a re-run of this workflow on a tag that already has a release (a manual
      # "re-run jobs", say) edits that release's notes instead of failing on "already exists" --
      # `gh release create` has no flag of its own for that, so this checks first.
      - name: Publish or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --notes-file /tmp/release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --notes-file /tmp/release-notes.md --verify-tag
          fi
