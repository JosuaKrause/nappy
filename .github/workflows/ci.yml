# The same gates a local commit rests on, plus the full suite split across parallel runners:
#   gates    lint.sh, test_cli_help.sh, pycheck.sh, check.sh's boot check, cost-table.sh --check,
#            then the two negative fixtures tools/test.sh must fail the gate on rather than hang
#            or pass -- everything that needs no more than one process, run before the sharded
#            suite rather than inside it.
#   shards   the headless suite, one matrix job per shard, each running tools/test.sh --shard
#            I/8 -- planned from tests/suite_costs.txt exactly as a local sharded run is.
#   test     what main's ruleset actually requires (a check named exactly `test`): it needs both
#            of the above and fails if either did, so the ruleset's own required-check name
#            still means "everything passed" without the ruleset itself changing.
# The Godot tools all honour GODOT=..., which is how CI points them at the downloaded Linux
# binary instead of the macOS default path. uv and ffmpeg are installed only in `gates`, which is
# the only job that runs the Python tooling; Godot is downloaded (or restored from cache) in
# both `gates` and `shards`, since both boot the engine.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels that pull request's older runs: only the newest head can
# merge, so a run on a superseded commit answers a question nobody is asking and holds nine
# runners while it does. A push to main is grouped by its own commit instead, so no run on main is
# ever cancelled by the next merge -- HANDOFF.md's advice to watch main's own run after a batch of
# merges depends on every merge commit getting its full run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  # tests/suite_costs.txt's longest row alone sets the floor no split can beat,
  # so this is a shard count that brings every other shard down to or under that same floor
  # rather than leaving it carrying idle neighbours -- `tools/test.sh --plan` at this count shows
  # the split. Fewer shards each carry more of the suites above that floor; more shards would only
  # wait on the same longest suite while paying for idle runners.
  SHARD_COUNT: 8

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # `filter: blob:none` is a partial clone: commits and trees come down up front, blob
      # content only for a path the sparse checkout below actually selects. That checkout excludes
      # docs/evidence/ (about 910 of the tree's 949 MB) and re-includes only the SVGs under it,
      # since tools/lint.sh's well-formedness check is the only thing this job reads there --
      # see docs/DECISIONS.md, M201, a CI job does not download the evidence.
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/evidence/
            /docs/evidence/**/*.svg

      - name: Lint the docs
        run: ./tools/lint.sh

      # Needs nothing but bash and the scripts under test -- no uv, no real Godot binary (it
      # stubs GODOT) -- so it runs this early, before either is set up.
      - name: Check --help/-h and rejection on every shell tool
        run: ./tools/test_cli_help.sh

      - name: Check the rule-loading hooks
        run: ./tools/test_rules_hooks.sh

      # The Python tooling: uv reads .python-version and uv.lock, so the interpreter and every
      # package are the ones the lockfile names rather than whatever the runner image ships.
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # tools/test_clip.py encodes a real burst through ffmpeg, which the runner image does not
      # ship; without it that test skips and the converter is never actually exercised.
      - name: Install ffmpeg
        run: sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Check the Python tools
        run: ./tools/pycheck.sh

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o ~/godot/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q ~/godot/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot-bin
          chmod +x ~/godot/godot-bin

      - name: Boot check
        run: GODOT="$HOME/godot/godot-bin" ./tools/check.sh

      # docs/COSTS.md is generated from the same EventDef/EventInstance/Tuning code the game
      # charges with -- a balance change that moved a row or a decay constant without
      # regenerating the table fails here, and the output names every row and column that moved.
      - name: Cost table is up to date
        run: GODOT="$HOME/godot/godot-bin" ./tools/cost-table.sh --check

      # tests/runner_fixtures/engine_error.gd emits one push_error() sentinel while its own
      # check() still passes -- proof that tools/test.sh's classifier refuses a Godot engine
      # diagnostic even when the runner's own checks/failures count says the run was clean. A
      # regression back to trusting Godot's exit code alone would pass this suite green.
      - name: Engine-error fixture must fail the gate
        run: |
          set +e
          GODOT="$HOME/godot/godot-bin" ./tools/test.sh runner_fixtures/engine_error.gd \
            > engine_error_fixture.log 2>&1
          status=$?
          set -e
          cat engine_error_fixture.log
          if [[ $status -eq 0 ]]; then
            echo "FAILED: runner_fixtures/engine_error.gd exited 0 -- the classifier let an engine error through" >&2
            exit 1
          fi
          if ! grep -qF "M164 sentinel" engine_error_fixture.log; then
            echo "FAILED: the sentinel never printed -- the fixture did not actually run" >&2
            exit 1
          fi
          if ! grep -qE '^[0-9]+ checks, [0-9]+ failures$' engine_error_fixture.log; then
            echo "FAILED: the normal runner summary line never printed" >&2
            exit 1
          fi
          echo "OK: the fixture failed the gate as required"

      # tests/runner_fixtures/unparseable_suite.gd.src holds a fixture whose GDScript text does
      # not parse -- kept off its real .gd name because an unparseable .gd anywhere in the tree
      # can break the atlas bake's own engine boot when the class-name cache is cold (see the
      # fixture's own header, and M172 in docs/DECISIONS.md). tools/test.sh stages it to its real
      # path only for this one process and removes the staged copy when the process ends. Before
      # M172, a suite `run_tests.gd` could not load aborted `_ready()` before `quit()`, so the
      # process idled forever instead of failing -- `timeout 30` is a safety net for that
      # regression, not the expected path: a fixed runner reports the load failure and exits in
      # a few seconds, and 30s stays well clear of that without waiting anywhere near the job's
      # own 15-minute timeout. Exit code 124 is `timeout`'s own for "killed after the limit", so
      # it is checked for and excluded from "non-zero" below, or a hang would read as the fixture
      # doing its job instead of as the regression it is.
      - name: Unparseable suite must fail the gate, not hang it
        run: |
          set +e
          GODOT="$HOME/godot/godot-bin" timeout 30 ./tools/test.sh runner_fixtures/unparseable_suite.gd \
            > unparseable_fixture.log 2>&1
          status=$?
          set -e
          cat unparseable_fixture.log
          if [[ $status -eq 124 ]]; then
            echo "FAILED: runner_fixtures/unparseable_suite.gd timed out -- the runner hung instead of failing" >&2
            exit 1
          fi
          if [[ $status -eq 0 ]]; then
            echo "FAILED: runner_fixtures/unparseable_suite.gd exited 0 -- a load failure did not fail the gate" >&2
            exit 1
          fi
          if ! grep -qF "unparseable_suite.gd" unparseable_fixture.log; then
            echo "FAILED: the fixture's name never printed -- the load failure was not reported by name" >&2
            exit 1
          fi
          if ! grep -qE '^[0-9]+ checks, [0-9]+ failures$' unparseable_fixture.log; then
            echo "FAILED: the normal runner summary line never printed" >&2
            exit 1
          fi
          echo "OK: the fixture failed the gate fast, by name, with a summary line"

  shards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # One slow shard should not cancel the rest -- each shard's log is its own evidence, and
      # cancelling the others would throw away timing data from a run that is otherwise fine.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      # Same partial clone as `gates` above, minus the SVG re-include: no suite `tools/test.sh`
      # runs reads a file under docs/evidence/ -- it only appears in doc comments naming where a
      # probe (never run in CI; see the verify skill) writes its own output. docs/DECISIONS.md, M201.
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/evidence/

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o ~/godot/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q ~/godot/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot-bin
          chmod +x ~/godot/godot-bin

      # tools/test.sh --shard I/N plans the full N-way split itself, from the same
      # tests/suite_costs.txt a local run reads, and runs only shard I of it -- one Godot
      # process, filtered to that shard's suites, which is why the runner's own PARTIAL RUN note
      # prints for every shard here and must never be read as a green build on its own.
      - name: Shard ${{ matrix.shard }}/${{ env.SHARD_COUNT }}
        run: GODOT="$HOME/godot/godot-bin" ./tools/test.sh --shard ${{ matrix.shard }}/${{ env.SHARD_COUNT }}

  # main's ruleset requires a check named exactly `test`; this job is that check; renaming the
  # job id would silently detach the ruleset from CI without editing the ruleset itself.
  test:
    needs: [gates, shards]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every gate and every shard passed
        run: |
          if [[ "${{ needs.gates.result }}" != "success" || "${{ needs.shards.result }}" != "success" ]]; then
            echo "gates: ${{ needs.gates.result }}, shards: ${{ needs.shards.result }}" >&2
            exit 1
          fi
