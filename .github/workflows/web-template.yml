# No Pages permissions or publication: this builds and exercises the release runtime.
name: web-template
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/web-template.yml'
      - '.github/workflows/deploy.yml'
      - 'tools/build-web-template.sh'
      - 'tools/web-template/**'
      - 'tools/export-web.sh'
      - 'export_presets.cfg'
      - '.github/actions/web-browser-check/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/web-template.yml'
      - '.github/actions/web-browser-check/**'
      - 'tools/build-web-template.sh'
      - 'tools/web-template/**'
permissions:
  contents: read
concurrency:
  group: web-template-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/evidence/
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check command-line and browser startup failures
        run: ./tools/test_cli_help.sh
      - name: Check browser scratch ownership against fixtures
        run: node --test tools/web-template/browser-scratch.test.mjs
      # The same template, export and browser check as ci.yml's `browser` job and the deploy.
      - name: Build the template, export and exercise the actual Wasm in Chrome
        id: check
        uses: ./.github/actions/web-browser-check
        with:
          release-tag: template-check
      - name: Keep the browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-template-browser-${{ github.sha }}
          path: ${{ runner.temp }}/browser-result
          if-no-files-found: warn
      - name: Keep the verified template
        uses: actions/upload-artifact@v4
        with:
          name: web-template-${{ steps.check.outputs.template-key }}
          path: build/web-template
