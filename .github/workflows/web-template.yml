# No Pages permissions or publication: this builds and exercises the release runtime.
name: web-template
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/web-template.yml'
      - '.github/workflows/deploy.yml'
      - 'tools/build-web-template.sh'
      - 'tools/web-template/**'
      - 'tools/export-web.sh'
      - 'export_presets.cfg'
  push:
    branches: [main]
    paths:
      - '.github/workflows/web-template.yml'
      - 'tools/build-web-template.sh'
      - 'tools/web-template/**'
permissions:
  contents: read
concurrency:
  group: web-template-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/evidence/
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Identify build inputs
        id: template
        run: echo "key=$(./tools/build-web-template.sh --key)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: build/web-template
          key: web-template-${{ steps.template.outputs.key }}
      - name: Build or verify the runtime
        run: ./tools/build-web-template.sh --jobs 4
      - name: Install the full matching editor
        run: |
          source tools/web-template/pins.env
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import and export the filtered game
        run: |
          ./tools/check.sh
          RELEASE_TAG=template-check ./tools/export-web.sh
      - name: Exercise the actual Wasm in Chrome
        run: |
          node tools/web-template/browser-check.mjs --export build/web \
            --output "$RUNNER_TEMP/browser-result" --browser /usr/bin/google-chrome
      - name: Keep the browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-template-browser-${{ github.sha }}
          path: ${{ runner.temp }}/browser-result
          if-no-files-found: warn
      - name: Keep the verified template
        uses: actions/upload-artifact@v4
        with:
          name: web-template-${{ steps.template.outputs.key }}
          path: build/web-template
