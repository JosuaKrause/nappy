<!-- Mother carrying the baby toward the viewer, mid-stride. The baby's head rests in
     her right arm and the wrapped body is supported by her left. Feet anchor at (12, 46). -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="46" viewBox="0 0 24 46" shape-rendering="geometricPrecision" stroke="#3b2d32" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round">
  <path d="M6 31 L11 31 L10 43 L5 43 Z" fill="#46506b"/>
  <path d="M13 31 L18 31 L19 43 L14 43 Z" fill="#3c4560"/>
  <path d="M4 43 L11 43 L10 46 L3 46 Z" fill="#2f2a2c"/>
  <path d="M13 43 L19 43 L21 46 L13 46 Z" fill="#2f2a2c"/>
  <path d="M5 13 Q12 10 19 13 L21 28 Q19 33 12 34 Q5 33 3 28 Z" fill="#b0574f"/>
  <path d="M4 27 Q12 30 20 27 L20 33 Q12 36 4 32 Z" fill="#8e433d"/>
  <!-- Her right sleeve bends inward so the hand cups the baby's head and neck. -->
  <path d="M5 16 Q1 18 2 23 Q3 26 7 23 L9 20 L7 17 Z" fill="#b0574f"/>
  <circle cx="7" cy="20.5" r="1.7" fill="#d9a878"/>
  <!-- A compact blanket bundle lies across her chest; no limb hangs outside it. -->
  <path d="M8 19 Q13 18 19 22 L18 27 Q12 28 7 22 Z" fill="#617087"/>
  <path d="M10 20 Q14 21 17 25" fill="none" stroke="#c4b79c" stroke-width="1"/>
  <circle cx="7.5" cy="18.2" r="2.7" fill="#d9a878"/>
  <path d="M5.2 17.5 Q7.4 14.7 9.7 17.2" fill="#3a2b26"/>
  <circle cx="6.8" cy="18.3" r="0.45" fill="#221f28" stroke="none"/>
  <path d="M6.9 19.5 L8.1 19.5" fill="none" stroke="#9b5e54" stroke-width="0.55"/>
  <!-- Her left forearm closes under the bundle and carries its weight. -->
  <path d="M19 16 Q23 18 22 22 Q21 26 16 28 L14 25 Q18 24 18 20 L17 17 Z" fill="#b0574f"/>
  <ellipse cx="15.5" cy="25.8" rx="1.8" ry="1.4" fill="#d9a878"/>
  <path d="M12 1 Q19 1 19 8 Q19 15 12 15 Q5 15 5 8 Q5 1 12 1 Z" fill="#d9a878"/>
  <path d="M5 7 Q6 1 12 1 Q18 1 19 7 Q16 5 12 5 Q8 5 5 7 Z" fill="#3a2b26"/>
