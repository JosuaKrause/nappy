<!-- Plinth: a stone base course along the wall's ground line, drawn at full colour over the
     tinted wall rather than tinted with it, in the same stone as the entrance door's step and
     surround. From the top: a dark outline where the brick meets it at y 26 (a poster's foot
     stays clear of it), a lit capping, the capping's shaded nose, then the base's face with a
     joint every half cell, and the ground line along the pavement. Seamless across. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect x="0" y="26" width="32" height="1" fill="#3b2d32"/>
  <rect x="0" y="27" width="32" height="1" fill="#d6cfc1"/>
  <rect x="0" y="28" width="32" height="1" fill="#aba395"/>
  <rect x="0" y="29" width="32" height="1" fill="#6f695f"/>
  <rect x="0" y="30" width="32" height="1" fill="#8d867b"/>
  <rect x="7" y="29" width="1" height="2" fill="#5f5a52"/>
  <rect x="23" y="29" width="1" height="2" fill="#5f5a52"/>
  <rect x="0" y="31" width="32" height="1" fill="#3b2d32"/>
</svg>
