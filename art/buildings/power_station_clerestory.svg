<!-- The power station hall's high windows: one tall, narrow steel-framed light of wired, dirty
     glass per facade column, filling the top two wall rows so the row of them reads as a
     clerestory band under the roof edge. Unlit: an industrial hall, not somebody's home. The
     canvas is two cells tall; its top-left corner is the top-left of the higher cell. -->
