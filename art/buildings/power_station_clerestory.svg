    <rect x="12" y="47" width="1" height="1"/><rect x="19" y="47" width="1" height="1"/>
    <rect x="12" y="51" width="1" height="1"/><rect x="19" y="51" width="1" height="1"/>
  </g>
  <rect x="6" y="57" width="20" height="3" fill="#b0aca3"/>
