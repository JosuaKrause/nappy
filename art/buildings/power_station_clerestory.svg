  <rect x="10" y="44" width="12" height="11" fill="#77766a"/>
  <rect x="10" y="23" width="12" height="2" fill="#474e51"/>
  <rect x="10" y="39" width="12" height="2" fill="#474e51"/>
  <rect x="15" y="9" width="2" height="46" fill="#474e51"/>
  <g fill="#5a6c68">
