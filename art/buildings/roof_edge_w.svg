<!-- Parapet along the roof's west edge: the dark outline of the silhouette, the lit coping,
     its inner edge, and the shadow it casts east across the roof. Translucent inside the
     outline so the roof's own tint shows through. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect x="0" y="0" width="1" height="32" fill="#3b2d32"/>
  <rect x="1" y="0" width="2" height="32" fill="#ffffff" fill-opacity="0.34"/>
  <rect x="3" y="0" width="1" height="32" fill="#3b2d32" fill-opacity="0.5"/>
  <rect x="4" y="0" width="1" height="32" fill="#221f28" fill-opacity="0.16"/>
  <rect x="5" y="0" width="1" height="32" fill="#221f28" fill-opacity="0.06"/>
</svg>
