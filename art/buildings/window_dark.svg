<!-- An unlit window: a pair of casements in a painted frame, set in the wall under a stone
     lintel and over a stone sill that throws a shadow on the brick. Dark glass with a curtain at
     each side and a streak of reflected sky. Not modulated by the building colour: glass and
     stone are what they are whatever the wall is. Registers exactly with window_lit.svg; only
     the light differs. Everything stays between y 2 and 30, so the two-pixel lift over a
     storefront or a door keeps the whole window in its own cell. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="geometricPrecision" stroke="#3b2d32" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round">
