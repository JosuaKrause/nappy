<!-- A gutted shopfront, burnt out: the fascia charred and its paint blistered away, the awning
     burnt off to two bent, blackened arms, the display window's glass gone with shards caught in
     the frame, the shop behind black, and the entrance at left boarded with charred planks.
     64x36, drawn in place of the plinth across two facade columns, its fill opaque over the wall;
     the same canvas, entrance (x 2..28) and display bay (x 30..62) as the four storefront
     pictures, on the shared ground line at y 36. Building.Condition.BURNT draws it in place of
     whichever storefront the pair rolled, awning or shutters alike. -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="36" viewBox="0 0 64 36" shape-rendering="geometricPrecision" stroke="#1c1718" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round">
