<!-- The burnt parapet's second picture: roof_edge_s_burnt.svg's charred coping and char band,
     broken in other places, a shallow notch at left and a deeper bite at right with a crack
     between them. Same canvas and registration; drawn on the columns between the first
     picture's, so the break falls somewhere different on every tile. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="geometricPrecision" stroke="none">
  <defs>
    <linearGradient id="char" x1="0" y1="10" x2="0" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d0b0c" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#0d0b0c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0d0b0c" stop-opacity="0.75"/>
    </linearGradient>
  </defs>
  <rect x="0" y="10" width="32" height="18" fill="url(#char)"/>
  <path d="M0 28 H3.6 L4.4 28.8 L6.8 28.8 L7.4 28 H20.4 L21.2 29.4 L22.6 30.4 L26.2 30.2 L27.2 29 L27.6 28 H32 V31 H0 Z" fill="#3b3432"/>
  <path d="M0 28.6 H3.4 M7.6 28.6 H20.2 M27.8 28.6 H32" fill="none" stroke="#5e5550" stroke-width="0.7"/>
  <path d="M21.2 29.4 L22.6 30.4 L26.2 30.2 L27.2 29 M4.4 28.8 L6.8 28.8" fill="none" stroke="#141112" stroke-width="0.7" stroke-linejoin="round"/>
  <path d="M11 28 L11.8 29.6 L11.2 30.8 M16 28 L15.6 30.6" fill="none" stroke="#141112" stroke-width="0.5"/>
  <rect x="0" y="31" width="32" height="1" fill="#1c1718"/>
</svg>
