<!-- The front parapet, where the roof meets the top of the front wall: the coping's inner
     edge, its lit top, and the dark outline along the wall head, which is the line that
     separates roof from wall. Translucent inside the outline so the roof's own tint shows
     through. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect x="0" y="27" width="32" height="1" fill="#221f28" fill-opacity="0.08"/>
  <rect x="0" y="28" width="32" height="1" fill="#3b2d32" fill-opacity="0.5"/>
  <rect x="0" y="29" width="32" height="2" fill="#ffffff" fill-opacity="0.34"/>
  <rect x="0" y="31" width="32" height="1" fill="#3b2d32"/>
</svg>
