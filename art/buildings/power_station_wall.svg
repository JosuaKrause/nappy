  <rect x="3" y="0" width="1" height="32" fill="#767c7b"/>
  <rect x="4" y="0" width="1" height="32" fill="#a1a6a4"/>
  <rect x="11" y="0" width="1" height="32" fill="#767c7b"/>
  <rect x="12" y="0" width="1" height="32" fill="#a1a6a4"/>
  <rect x="19" y="0" width="1" height="32" fill="#767c7b"/>
  <rect x="20" y="0" width="1" height="32" fill="#a1a6a4"/>
  <rect x="27" y="0" width="1" height="32" fill="#767c7b"/>
  <rect x="28" y="0" width="1" height="32" fill="#a1a6a4"/>
  <rect x="0" y="31" width="32" height="1" fill="#646a69"/>
