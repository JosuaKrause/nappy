  <path d="M5.6 22.2 C6.8 20.6 11.4 21 12 23 C12.6 25 9.4 26.6 7.2 26 C5.4 25.4 4.8 23.4 5.6 22.2 Z" fill="#f8f8f8"/>
  <path d="M12.6 12.6 C14 11.8 17.4 12.4 17.4 13.8 C17.4 15 15 15.6 13.6 15.2 C12.4 14.8 11.8 13.2 12.6 12.6 Z" fill="#f6f6f6"/>
  <g fill="#e2e2e2">
