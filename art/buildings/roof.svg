<!-- Roof fill: a flat roof of weathered membrane — soft, uneven patches where it has faded or
     held the wet, and a scatter of grit. No seams or courses: a roof many cells wide reads as
     one surface rather than a grid. Neutral greys, white where the runtime tints it, for the
     same reason as wall.svg: the variant's roof colour is multiplied over the whole cell. Every
     mark stays inside the cell, so the tile repeats with no join. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="geometricPrecision">
  <rect x="0" y="0" width="32" height="32" fill="#ffffff"/>
