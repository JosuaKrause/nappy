<!-- Parapet along the roof's east edge: the dark outline of the silhouette, the coping a
     little less lit than the west one, and its inner edge. It casts its shadow off the roof,
     so none falls inside. Translucent inside the outline so the roof's own tint shows through. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect x="28" y="0" width="1" height="32" fill="#3b2d32" fill-opacity="0.5"/>
  <rect x="29" y="0" width="2" height="32" fill="#ffffff" fill-opacity="0.26"/>
  <rect x="31" y="0" width="1" height="32" fill="#3b2d32"/>
</svg>
