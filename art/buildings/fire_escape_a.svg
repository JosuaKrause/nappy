<!-- One floor of a fire escape in black-painted iron: a railed balcony at the floor line on knee
     brackets, in front of that floor's window, with a potted plant standing on it, and the flight
     hung from its east end that runs down parallel to the facade to the west, handrail and open
     treads over a stringer, to the balcony one floor below. src/city/building.gd stacks it once
     per floor from the top floor's floor line down, every flight the same way round, and puts
     fire_escape_platform_a.svg, this balcony with the flight taken out, on the first floor's
     floor line, so nothing comes down to the sidewalk. The iron casts its shadow on the wall down
     and to the east. Transparent 48x64 facade overlay; drawing anchor (24,64), the floor line of
     the floor below the balcony, at the column's centre. fire_escape_b.svg is the same escape
     with no plant. -->
