<!-- A fire escape in black-painted iron, ending at the first floor as a real one does: a
     railed balcony across the first floor on knee brackets, in front of that floor's window,
     with its drop ladder stowed upright against the wall at the west end and a potted plant
     standing on it. Nothing comes down to the sidewalk: below the balcony there are only the
     brackets that carry it, and the shadow the iron casts on the wall down and to the east.
     Transparent 48x64 facade overlay; drawing anchor (24,64), the ground line at the column's
     centre. fire_escape_b.svg is the same escape mirrored, with no plant. -->
