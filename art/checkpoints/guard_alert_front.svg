<!-- Checkpoint guard on alert, front: the sentry of guard_standing_front.svg the moment he has
     noticed her, before he moves. Square-on, feet planted wider, one hand raised palm out at
     head height: *stop there*. His other arm stays down. guard_lunging_front.svg is the run,
     stride thrown and the hand out low. Shared by the hunting roadblock's guard and the door
     guard. Ground anchor bottom centre (11,44). -->
