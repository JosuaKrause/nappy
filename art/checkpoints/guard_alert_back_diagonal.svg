<!-- Checkpoint guard on alert, back diagonal: guard_alert_front_diagonal.svg turned to the
     north-east, the sentry of guard_standing_back_diagonal.svg the moment he has noticed her,
     before he moves. Feet planted wider, his far hand raised palm out at head height beyond his
     shoulder, his near arm down. guard_lunging_back_diagonal.svg is the run. Shared by the
     hunting roadblock's guard and the door guard. East-authored like the rest of the family;
     EventInstance mirrors it for north-west. Canvas widened to 26, 2px each side, for the hand,
     and the whole figure moved +2 with it, so the body stands where
     guard_standing_back_diagonal.svg's does over the same bottom-centre ground anchor (13,44
     here, 11,44 there) and does not step at the swap. -->
