<!-- Checkpoint guard on alert, front diagonal: guard_alert_front.svg turned to the south-east,
     the sentry of guard_standing_front_diagonal.svg the moment he has noticed her, before he
     moves. Feet planted wider, his far hand raised palm out in front of his face at head
     height, his near arm down. guard_lunging_front_diagonal.svg is the run. Shared by the
     hunting roadblock's guard and the door guard. East-authored like the rest of the family;
     EventInstance mirrors it for south-west. Canvas widened to 26, 2px each side, for the hand,
     and the whole figure moved +2 with it, so the body stands where
     guard_standing_front_diagonal.svg's does over the same bottom-centre ground anchor (13,44
     here, 11,44 there) and does not step at the swap. -->
