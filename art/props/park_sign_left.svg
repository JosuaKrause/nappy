<!-- A park sign at a street corner, pointing left, along a street running across the screen: a green plate with a white reflective rim,
     a white tree for the park and a white arrow for the way to it, on a steel post. The plate faces
     the camera in every direction, so the arrow printed on it is the whole of which way it points;
     green against the closed plate's red, so it never reads as a street or a park shut. ParkSign
     draws its shadow under it. Feet-anchored at the bottom centre (14,46). -->
<svg xmlns="http://www.w3.org/2000/svg" width="28" height="46" viewBox="0 0 28 46" shape-rendering="geometricPrecision" stroke="#2a2226" stroke-width="1" stroke-linejoin="round" stroke-linecap="round">
  <!-- The post, lit down its left side, standing in a small foot. -->
  <path d="M12.8 19 L15.2 19 L15.2 45.4 L12.8 45.4 Z" fill="#6b6357"/>
  <path d="M13.6 19.6 L13.6 44.8" fill="none" stroke="#a39b8e" stroke-width="0.7"/>
  <path d="M11.2 43.6 L16.8 43.6 L16.8 45.6 L11.2 45.6 Z" fill="#3a3436" stroke-width="0.8"/>
  <!-- The plate: white rim, green face shaded along its foot, a glint along its top. -->
  <path d="M3.4 1 L24.6 1 Q26 1 26 2.4 L26 18.6 Q26 20 24.6 20 L3.4 20 Q2 20 2 18.6 L2 2.4 Q2 1 3.4 1 Z" fill="#f2eee4" stroke-width="1.2"/>
  <path d="M4.4 2.6 L23.6 2.6 Q24.4 2.6 24.4 3.4 L24.4 17.6 Q24.4 18.4 23.6 18.4 L4.4 18.4 Q3.6 18.4 3.6 17.6 L3.6 3.4 Q3.6 2.6 4.4 2.6 Z" fill="#2f6e3e" stroke="none"/>
  <path d="M3.6 15.6 L24.4 15.6 L24.4 17.6 Q24.4 18.4 23.6 18.4 L4.4 18.4 Q3.6 18.4 3.6 17.6 Z" fill="#0f2a17" fill-opacity="0.35" stroke="none"/>
  <path d="M4.8 3.8 L11.6 3.8" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="0.8"/>
  <!-- The tree: a crown of four lobes on a trunk. -->
  <path d="M18.8 11.4 L18.8 15.8" fill="none" stroke="#f2eee4" stroke-width="1.8"/>
  <circle cx="18.8" cy="6.4" r="2.8" fill="#f2eee4" stroke="none"/>
  <circle cx="16.3" cy="9" r="2.5" fill="#f2eee4" stroke="none"/>
  <circle cx="21.3" cy="9" r="2.5" fill="#f2eee4" stroke="none"/>
  <circle cx="18.8" cy="9.6" r="2.4" fill="#f2eee4" stroke="none"/>
  <!-- The arrow, pointing left. -->
  <path d="M13.4 9.3 L9 9.3 L9 6.6 L5.2 10.5 L9 14.4 L9 11.7 L13.4 11.7 Z" fill="#f2eee4" stroke="none"/>
</svg>
