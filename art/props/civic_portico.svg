     entrance door's surround and the windows' lintels and sills: a pediment with a medallion
     in its shaded tympanum over an entablature, two columns lit on the west and turning into
     shadow on the east, a dark porch behind them with a glazed fanlight over a pair of panelled
     wooden doors with brass pulls, and three stone steps down to the ground line. The portico
     casts a narrow shadow on the wall to its east. Ground anchor (16,48). -->
