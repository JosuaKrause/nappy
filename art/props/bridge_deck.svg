  <rect x="26" y="0" width="140" height="256" fill="#3b3b45"/>
  <rect x="92" y="0" width="3" height="256" fill="#b9b087"/>
  <rect x="98" y="0" width="3" height="256" fill="#b9b087"/>
  <rect x="8" y="0" width="18" height="256" fill="#5a5048"/>
  <rect x="166" y="0" width="18" height="256" fill="#5a5048"/>
  <rect x="8" y="0" width="18" height="5" fill="#6d6259"/>
  <rect x="166" y="0" width="18" height="5" fill="#6d6259"/>
  <rect x="10" y="18" width="14" height="10" fill="#7b6f64"/>
  <rect x="168" y="18" width="14" height="10" fill="#7b6f64"/>
  <rect x="10" y="72" width="14" height="10" fill="#7b6f64"/>
