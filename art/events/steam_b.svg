<!-- Basement steam, second frame: the plume billowing. The cloud from `steam.svg` has lifted
     and spread, and a fresh puff is pushing up out of `steam_grate.svg` under it. Same 32x48
     canvas and bottom-centre anchor, the grate's centre, as `steam.svg`, so alternating the two
     frames moves nothing but the steam. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="48" viewBox="0 0 32 48" shape-rendering="geometricPrecision" stroke="#3b3034" stroke-linejoin="round" stroke-linecap="round">
  <!-- Ground anchor is the canvas bottom centre, the middle of the grate the cloud rises from. -->
  <!-- The lifted cloud, thinner than the fresh puff below it. -->
  <path d="M6 22C2 21 2 15 7 15C6 10 11 7 15 10C16 6 23 6 24 10C29 9 31 15 28 18C31 21 27 25 23 23C21 26 16 26 14 23C11 25 7 25 6 22Z" fill="#d5d7cf" fill-opacity="0.6" stroke="#777d7e" stroke-width="1"/>
  <path d="M9 17C12 19 15 16 18 18M20 13C22 12 24 13 25 14" fill="none" stroke="#f0eee3" stroke-width="1"/>
  <!-- The fresh puff pushing up out of the slots. -->
  <path d="M10 46C7 44 8 39 11 39C10 35 14 33 16 35C18 32 23 35 22 38C25 40 24 45 21 46C19 47.5 13 47.5 10 46Z" fill="#d5d7cf" fill-opacity="0.82" stroke="#777d7e" stroke-width="1"/>
  <path d="M12 41C14 42 17 40 20 41" fill="none" stroke="#f0eee3" stroke-width="1"/>
</svg>
