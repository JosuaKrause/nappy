<!-- Hooded robber on alert, front diagonal, walk frame b: robber_alert_front_diagonal.svg's
     partner in his two-frame walk toward her while he warns, in the spirit of
     robber_alert_side_b.svg. robber_alert_front_diagonal.svg is the planted step, stance wide, the
     near arm held back off the body and the far hand forward past his front; this is the
     passing step: the feet drawn in under him and the near arm swung forward, its open hand
     held low in front of the coat at the hip, the far arm hidden behind him. The hand is out of
     the coat, so it is still not robber_waiting_front_diagonal.svg; it is not reaching, so it is
     still not robber_lunging_front_diagonal.svg. Torso and hood are the partner's, unmoved.
     East-authored like the rest of the family; EventInstance mirrors it for south-west. Canvas
     26x44, ground anchor bottom centre (13,44), the partner's, so the cycle does not jump. -->
