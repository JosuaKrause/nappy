     viewer, the same animal as charging_dog_back_diagonal.svg (dark coat, tan points) sitting
     on the sidewalk: the rump and the near haunch on the ground, the tail lying out along the
     ground towards the viewer, the near front leg straight down beyond the chest, the back
     smooth with no hackles, the head held easy and turned away with both ears up and soft; no
     red shows, since the jaw is shut. Faces north-east, away from the viewer and to the right;
     EventInstance mirrors it for north-west. Canvas 38x28, ground anchor bottom centre (19,28),
     the canvas charging_dog_back_diagonal.svg uses; the near haunch and hind paw stand on the
     canvas bottom. -->
