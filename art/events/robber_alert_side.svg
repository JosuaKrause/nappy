<!-- Hooded robber on alert, side: robber_alert_front_b.svg facing east. Knees set, body leaning
     toward her, the near hand out of the coat and held low in front of the hip: ready, not yet
     reaching. robber_lunging_side.svg is the reach itself, the arm thrown out at shoulder
     height and the stride open. Canvas widened to 26 for the hand; ground anchor bottom
     centre (13,44).
