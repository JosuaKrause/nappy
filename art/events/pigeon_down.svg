<!-- The same pigeon on the downstroke: the wings swept down below the body instead of raised
     above it. Two frames rather than one because a bird that does not flap is a bird that has
     stopped: a moving thing has to look like it is moving, at the one row where the movement
     IS the event. This is also the frame a bird standing on the sidewalk is drawn with,
     feet on the ground, since the upstroke is a flock that has already gone. Canvas 18x14,
     ground anchor bottom centre (9,14); body, head, tail and feet are the same paths as
     pigeon.svg, so the two frames register exactly. -->
