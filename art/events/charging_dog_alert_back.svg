<!-- The charging dog on alert, back view: charging_dog_alert.svg from behind, the same animal
     as charging_dog_back.svg the moment it has noticed her. Squared up on four stiff straight
     legs, the rump held high, the hackle ridge standing along the spine, the tail held up stiff,
     the head raised beyond the shoulders with both ears pricked straight up. Read against
     charging_dog_back.svg, whose legs kick out and whose ears lie pinned flat. Canvas 30x28,
     ground anchor bottom centre (15,28), the canvas charging_dog_back.svg uses; the near hind
     paws stand on the canvas bottom. -->
