<!-- Hooded robber on alert, back diagonal, walk frame b: robber_alert_back_diagonal.svg's
     partner in his two-frame walk while he warns, robber_alert_front_diagonal_b.svg turned to
     the north-east. robber_alert_back_diagonal.svg is the planted step, stance wide, the near
     arm held back off the body and the far hand forward past his front; this is the passing
     step: the feet drawn in under him and the near arm swung forward past his front hip, hidden
     behind his back but for its sleeve and open hand showing past his front edge, painted before
     the torso the way frame a's far arm is; the far arm hidden in front of him. The rear of the hood hides the face
     opening. Torso and hood are the partner's, unmoved. East-authored like the rest of the
     family; EventInstance mirrors it for north-west. Canvas 26x44, ground anchor bottom centre
     (13,44), the partner's, so the cycle does not jump. -->
<svg xmlns="http://www.w3.org/2000/svg" width="26" height="44" viewBox="0 0 26 44" shape-rendering="geometricPrecision" stroke="#3b2d32" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round">
