<!-- An east-west street seen across its width: the same two cars locked side by side across the
     road, now in profile — the blue one in the far lane facing east, its nose driven in and its
     hood sprung, the red one in the near lane facing west, its tail stove in where the blue one
     hit it — with glass and a
     bumper on the road, coolant under them, smoke puffing up off the blue car's hood (the second of its two frames:
     the puffs one beat further up; everything else identical to
     `car_accident_vertical.svg`), and an onlooker on
     each pavement: the event `person` figure, facing the crash (`person_front.svg` on the far
     pavement, `person_back.svg` on the near one). The cars are the crowd cars' profile. Drawn by
     `_draw_wide_scene` fitted to the 192px obstruction with its centre on the ground point. The
     wheels stand on the ground contacts in `car_accident_vertical_shadow.svg` (y 88 and 110),
     which `EventCatalogue._car_accident_parts()` reads as the two solid bodies: they must not
     move. -->
