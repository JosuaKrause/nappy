<!-- Hooded robber on alert, front, walk frame b: robber_alert_front.svg's partner in his
     two-frame walk toward her while he warns. robber_alert_front.svg is the planted step, feet
     wide and both arms held off the body; this is the passing step, in the spirit of
     robber_alert_side.svg: the feet drawn in under him with the far foot lifted off the ground,
     the arms brought in, one hand held low in front of the coat at the hip and the other hanging
     beside it. Both hands stay out of the coat, so it is still not robber_waiting_front.svg; no
     arm is reaching, so it is still not robber_lunging_front.svg. Torso and hood are
     robber_alert_front.svg's, unmoved. Canvas 26x44, ground anchor bottom centre (13,44), the
     partner's, so the cycle does not jump. -->
<svg xmlns="http://www.w3.org/2000/svg" width="26" height="44" viewBox="0 0 26 44" shape-rendering="geometricPrecision" stroke="#3b2d32" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round">
