<!-- Basement steam, first frame: the cloud alone, rising out of `steam_grate.svg`, the floor
     grate that lies at the vent whether it blows or not and is drawn separately under this.
     Standing picture, 32x48; its bottom-centre anchor is the grate's centre, so the column
     comes up out of the slots with no offset of its own. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="48" viewBox="0 0 32 48" shape-rendering="geometricPrecision" stroke="#3b3034" stroke-linejoin="round" stroke-linecap="round">
  <!-- Ground anchor is the canvas bottom centre, the middle of the grate the cloud rises from. -->
  <!-- The column coming up out of the slots. -->
  <path d="M10 47C9 44 11 42 10 39C12 37 14 38 16 36C18 38 20 37 22 39C21 42 23 44 22 47C19 45.5 13 45.5 10 47Z" fill="#d5d7cf" fill-opacity="0.55" stroke="#777d7e" stroke-width="0.8"/>
  <path d="M13 46C12 43.5 14 41.5 13 39.5M19 46C20 43.5 18 41.5 19 39.5" fill="none" stroke="#f0eee3" stroke-width="0.8" stroke-opacity="0.5"/>
  <!-- The cloud it feeds. -->
  <path d="M8 32C3 28 8 24 12 26C9 21 13 17 17 20C16 14 22 13 24 18C29 18 30 24 26 27C31 31 25 36 21 33C19 39 12 39 10 34C9 34 8 33 8 32Z" fill="#d5d7cf" fill-opacity="0.72" stroke="#777d7e" stroke-width="1"/>
  <path d="M11 28C15 30 18 27 21 29" fill="none" stroke="#f0eee3" stroke-width="1"/>
</svg>
