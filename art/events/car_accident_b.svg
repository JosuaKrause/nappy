<!-- A north-south street seen across its width: two cars locked side by side across the
     carriageway after they met — the blue one seen from behind, its right flank stove in, the
     red one seen from the front, its left flank crushed to match — with glass and a torn-off
     bumper on the road, coolant spreading under them, smoke puffing up off the seam (the second of its two frames:
     the puffs one beat further up; everything else identical to `car_accident.svg`), and an onlooker on each
     pavement. The cars are the crowd cars' end-on projection; the onlookers are the event
     `person` figure (`person_front_diagonal.svg`, the right one mirrored), each turned towards
     the crash. Native 200x50, fitted by `_draw_wide_scene` to the 192px obstruction with its
     bottom edge on the ground point. The cars stand at x 63-91 and 92-120 over their ground
     contacts in `car_accident_shadow.svg` (77 and 106), which `EventCatalogue.
     _car_accident_parts()` reads as the two solid bodies: they must not move. -->
