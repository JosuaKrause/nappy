     three-quarter head with both eyes. Faces south-east, towards the viewer and to the right;
     EventInstance mirrors it for south-west. Canvas 38x28, ground anchor bottom centre (19,28),
     the canvas charging_dog_front_diagonal.svg uses; the nearest paw stands on the canvas
