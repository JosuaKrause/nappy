<!-- The charging dog on alert, front diagonal view: charging_dog_alert.svg turned towards the
     viewer, the same animal as charging_dog_front_diagonal.svg the moment it has noticed her.
     Up on four stiff straight legs, head raised and pointed at her, ears pricked straight up,
     the hackles standing along its shoulders, the tail held up stiff, lips drawn back off white
     teeth with the jaw still shut; the open red jaw stays the charge's own. The body is the side
     view's, foreshortened along its length as charging_dog_front_diagonal.svg is against
     charging_dog.svg, and the head is that view's three-quarter head with both eyes. Faces
     south-east, towards the viewer and to the right; EventInstance mirrors it for south-west.
     Canvas 38x28, ground anchor bottom centre (19,28), the canvas
     charging_dog_front_diagonal.svg uses; the nearest paw stands on the canvas bottom. -->
