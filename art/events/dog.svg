<!-- The dog on the other end of the lead. Drawn low and braced, because the whole hazard is
     that it lunges: how dangerous a thing is has to be visible from looking at the thing.
     A pet, and it has to read as one beside the charging dog: a light tan coat with a cream
     chest and muzzle, soft ears that hang, the tail carried up, a blue collar. The charging
     dog is the dark one with pricked-back ears, raised hackles and a red open jaw.
     Faces east; EventInstance mirrors it for a westward heading. Canvas 26x20, ground
     anchor bottom centre (13,20), paws on the bottom edge. dog_b.svg is the same body with
     the legs moved: this frame spreads them, the b frame brings them under the body. -->
