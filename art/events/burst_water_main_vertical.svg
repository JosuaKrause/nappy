<!-- The burst main authored for an east-west street: the crater runs across the carriageway from
     pavement to pavement, the split main lies along the street with its two broken mouths facing
     each other, the water fountains out of the gap and spreads, and a barrier stands on each
     pavement in its narrow end-on projection. Drawn by `_draw_wide_scene` fitted to the 192px
     obstruction with its centre on the ground point. Ground seen from overhead with the far wall
     showing, fountain and barriers upright. No shadow anywhere. -->
