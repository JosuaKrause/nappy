  <g stroke="none">
    <path d="M1.00 3 L5.00 3 L4.33 8 L0.00 8 Z M9.00 3 L13.00 3 L13.00 8 L8.67 8 Z M17.00 3 L21.00 3 L21.67 8 L17.33 8 Z" fill="#d8705a"/>
