    <circle cx="14.2" cy="15.4" r="0.55"/>
    <circle cx="18.6" cy="15.6" r="0.55"/>
  </g>
  <path d="M5.4 16.8 L6.4 15.8 M12.4 16.8 L13.4 15.8 M19.2 16.8 L20.2 15.6" fill="none" stroke="#2a2226" stroke-opacity="0.5" stroke-width="0.5"/>
  <!-- The awning's shade falling on the goods. -->
  <path d="M3 13.6 L23 13.6 L23 16 L3 16 Z" fill="#1c1418" fill-opacity="0.22" stroke="none"/>
