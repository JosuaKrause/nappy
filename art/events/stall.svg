<!-- One trestle of a market stall: fruit and greens in crates on a wooden counter, under a
     red-and-cream striped awning. Repeated across the width the event obstructs, like the café
     tables, so what is drawn is exactly what is in the way. Read against `cafe_table.svg`:
     taller, with a canopy, so the two things that take a pavement in act I are not the same
     silhouette twice. The awning spans the whole canvas and its six stripes start red at one edge
     and end cream at the other, so neighbouring trestles join into one continuous striped canopy
     however `_draw_spread` stretches them (narrower broadside on, shorter end-on).
     Feet-anchored at the bottom centre; the row's own shadow is drawn by the code. -->
<svg xmlns="http://www.w3.org/2000/svg" width="26" height="36" viewBox="0 0 26 36" shape-rendering="geometricPrecision" stroke="#2a2226" stroke-width="1" stroke-linejoin="round" stroke-linecap="round">
  <!-- The awning's two poles and the counter's legs. -->
  <path d="M2 12 L2 35.2 M24 12 L24 35.2" fill="none" stroke="#2a2226" stroke-width="2.4"/>
  <path d="M2 12.4 L2 35 M24 12.4 L24 35" fill="none" stroke="#8a6440" stroke-width="1"/>
  <path d="M6 29 L6 34.6 M20 29 L20 34.6" fill="none" stroke="#2a2226" stroke-width="2"/>
  <!-- The counter: a plank front, shaded along its foot. -->
  <path d="M3 20.6 L23 20.6 L23 29.6 L3 29.6 Z" fill="#8a6440"/>
  <path d="M3.6 23.6 L22.4 23.6 M3.6 26.6 L22.4 26.6" fill="none" stroke="#5e4128" stroke-width="0.7"/>
  <path d="M3.5 27.8 L22.5 27.8 L22.5 29.1 L3.5 29.1 Z" fill="#3b2410" fill-opacity="0.3" stroke="none"/>
  <!-- Three crates on the counter, heaped with apples, oranges and greens. -->
  <path d="M3 17.4 L23 17.4 L23 20.6 L3 20.6 Z" fill="#b08456"/>
  <path d="M9.6 17.4 L9.6 20.6 M16.4 17.4 L16.4 20.6" fill="none" stroke-width="0.8"/>
  <path d="M3.6 18.4 L22.4 18.4" fill="none" stroke="#d2ad7c" stroke-width="0.6"/>
  <path d="M3.4 17.6 Q3.6 14.6 5.4 14.8 Q6.4 13.4 7.8 14.4 Q9.6 14.2 9.4 17.6 Z" fill="#c4503c" stroke-width="0.8"/>
  <path d="M10 17.6 Q9.8 14.8 11.8 14.8 Q13 13.2 14.4 14.4 Q16.4 14.4 16 17.6 Z" fill="#e0862a" stroke-width="0.8"/>
  <path d="M16.8 17.6 Q16.4 15 18.2 14.6 Q19.2 13 20.8 14.2 Q22.8 14.4 22.6 17.6 Z" fill="#6f8f4a" stroke-width="0.8"/>
