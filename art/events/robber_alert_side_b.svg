<!-- Hooded robber on alert, side, walk frame b, the passing step: robber_alert_front_b.svg
     facing east, and robber_alert_side.svg's partner in his two-frame walk toward her while he
     warns. Knees set, body leaning toward her, the near hand out of the coat and held low in
     front of the hip: ready, not yet reaching. robber_lunging_side.svg is the reach itself, the
     arm thrown out at shoulder height and the stride open. The side alert approved on PR #726
     (A on PR #750), the drawing unchanged. Canvas 26x44, ground anchor bottom centre (13,44),
     torso and hood those of robber_alert_side.svg, so the cycle does not jump. -->
