<!-- Hooded robber on alert, side, walk frame b: robber_alert_side.svg's partner in his
     two-frame walk toward her while he warns. robber_alert_side.svg is the passing step, feet
     under him and the near hand held low in front of the hip; this is the planted step: the
     stance wide, the back foot planted behind him and the front foot ahead, the near arm held
     off the body, back and low, with its open hand behind his hip, and the far arm hanging
     forward of his chest with its hand showing past his front, so both hands are out of the
     coat on either side of him as they are in robber_alert_front.svg. Still not a reach:
     robber_lunging_side.svg's arm is thrown out at shoulder height. Drawn first as the second
     side alert of the teal-trout views sheet (robber_alert_side-v2.svg there), unchanged here.
     Faces east; mirrored for a westward heading. Canvas 26x44, ground anchor bottom centre
     (13,44), robber_alert_side.svg's, torso and hood unmoved from it, so the cycle does not
     jump. -->
