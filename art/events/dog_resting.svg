<!-- The charging dog at rest, side view: the same animal as charging_dog.svg (dark coat, tan
     points) sitting on the sidewalk while it waits, so the waiting dog stands on the ground
     instead of holding its gallop in the air. Everything that says *coming at you* is put away:
     ears up and soft rather than pinned, the back smooth with no hackles, the jaw shut, the tail
     lying on the ground. dog_alert.svg is the same dog once it has noticed her. Faces east;
     mirrored for a westward heading like charging_dog.svg. Canvas 40x22, ground anchor bottom
     centre (20,22), the canvas charging_dog.svg uses, so the three stages swap in place. -->
