<!-- The van a night raid arrives in: a tall dark box with mesh over every window and a step down
     the side. Read against `unmarked_van.svg`, which is the same colour family and the opposite
     idea — that one is trying not to be seen and this one is not. The grilles are what tell them
     apart, and they are drawn coarse enough to survive being shrunk. -->
