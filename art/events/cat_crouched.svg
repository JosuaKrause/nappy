<!-- The cat before it bolts. The crouch IS the telegraph, so it has to read as coiled: low,
     compact, haunches bunched, head down and forward, ears up, tail laid along the ground.
     A gray tabby with a pale chest and muzzle and yellow eyes, drawn in the dogs' idiom
     (outlined, shaded body, outlined limbs) and plainly neither of them.

     Facing east, like `cat_running.svg` and like everything else that has a front; the
     two postures must at least point the same way as each other. EventInstance mirrors it
     for a westward heading. Canvas 30x20, ground anchor bottom centre (15,20), paws and
     tail on the bottom edge. -->
