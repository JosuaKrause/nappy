<!-- The closing roadblock's screen-edge badge (`EventPictures.icon_for()`): one block of its
     barrier with the coil of razor wire over it, so the badge says a street shut wall to wall
     before the barrier is in sight. Its silhouette is the wire's row of loops over a low block,
     where the open roadblock's badge (`checkpoint_block.svg`) is a flat-topped block with a
     striped panel: the badge is what tells her which of the two is coming, whether she can get
     past it or has to go round. -->
