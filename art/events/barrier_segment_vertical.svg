<!-- One stretch of the red-and-white roadworks barrier seen end-on, for an east-west street
     (`EventInstance._roadwork_segment_texture`). The barrier runs away from the camera, so its
     striped board projects to a narrow upright band, and the one thing seen broadside is each
     trestle's pair of legs splayed out to either side. `_draw_spread` stacks these down the
     screen with no gap and stretches each to its share of the obstruction, so the band runs the
     full height with no end line, its stripes repeat every 13px (twice per segment) so every
     seam meets on the same phase, and every stretch carries one trestle at its foot: a
     continuous board on repeated legs rather than a pile of separate panels.
     Everything is clipped inside the band. Feet-anchored at the bottom centre; `barrier_end.svg`
     posts cap the two ends. -->
<svg xmlns="http://www.w3.org/2000/svg" width="14" height="26" viewBox="0 0 14 26" shape-rendering="geometricPrecision" stroke="#2a2226" stroke-width="1" stroke-linejoin="round" stroke-linecap="round">
  <defs>
    <clipPath id="rw-vert-board">
      <rect x="3" y="0" width="8" height="26"/>
    </clipPath>
  </defs>
  <!-- The trestle: two legs splayed out from under the board, braced across. -->
  <path d="M5 16.5 L1.4 24.6 M9 16.5 L12.6 24.6 M2.9 21.4 L11.1 21.4" fill="none" stroke="#2a2226" stroke-width="3"/>
  <path d="M5 16.5 L1.4 24.6 M9 16.5 L12.6 24.6 M2.9 21.4 L11.1 21.4" fill="none" stroke="#6b6357" stroke-width="1.4"/>
  <path d="M0.6 25 L2.8 25 M11.2 25 L13.4 25" fill="none" stroke="#2a2226" stroke-width="1.6"/>
  <!-- The board, end-on: cream with red stripes slanting across it, lit down its left edge
       and shaded down its right, where it turns away. -->
  <rect x="3" y="0" width="8" height="26" fill="#e8dfc8" stroke="none"/>
  <g clip-path="url(#rw-vert-board)" stroke="none">
    <path d="M3 -13 L3 -6.5 L11 -3 L11 -9.5 Z M3 0 L3 6.5 L11 10 L11 3.5 Z M3 13 L3 19.5 L11 23 L11 16.5 Z M3 26 L3 32.5 L11 36 L11 29.5 Z" fill="#c4503c"/>
    <path d="M8.6 0 L11 0 L11 26 L8.6 26 Z" fill="#3b2020" fill-opacity="0.26"/>
    <path d="M4.1 0 L4.1 26" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="0.9"/>
  </g>
  <path d="M3 0 L3 26 M11 0 L11 26" fill="none" stroke-width="1.2"/>
</svg>
