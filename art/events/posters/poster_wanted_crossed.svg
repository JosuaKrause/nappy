<!-- The wanted notice with its one swappable slot (row 2, column 1) crossed out in red — drawn
     the day the neighbor from M181's day 10 was not warned before the raid, never explained
     in the game. Identical to poster_wanted.svg except for the cross; see that file for the
     sheet's own layout and every other slot. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect x="6" y="4" width="20" height="25" fill="#cfc9ba" stroke="#3b3034" stroke-width="1"/>
  <rect x="6" y="4" width="20" height="3" fill="#4a463f"/>
  <!-- row 1 -->
  <g>
    <rect x="9" y="7" width="7" height="6" fill="#bdb6a4" stroke="#3b3034" stroke-width="0.6"/>
    <rect x="10.5" y="8" width="4" height="3" fill="#7d6b5a"/>
    <rect x="10" y="11" width="5" height="2" fill="#7d6b5a"/>
  </g>
  <g>
    <rect x="18" y="7" width="7" height="6" fill="#bdb6a4" stroke="#3b3034" stroke-width="0.6"/>
    <rect x="19.5" y="8" width="4" height="3" fill="#7d6b5a"/>
    <rect x="19" y="11" width="5" height="2" fill="#7d6b5a"/>
  </g>
  <!-- row 2 — left slot is the placeholder adult face, the neighbor's, crossed out here -->
  <g>
