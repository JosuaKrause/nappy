<!-- The wanted notice: gray-beige paper under an inset dark header, four mugshot frames in two
     rows of two, each a dark head-and-shoulders silhouette in a thin dark frame with a gray
     print line beneath it - a different style from the leader's coloured portrait. After the
     player's poster reference sheet, which has two print lines under each frame; at 20x22 only
     one fits. The top-right face is crossed out on every copy. Same 20x22 sheet as every poster
     kind; see poster_leader.svg.
     The bottom-left slot, the group "neighbor_slot" (a 7x5 frame whose top-left corner is at
     8,16), is the neighbor's: the same head-and-shoulders silhouette under the work cap
     the neighbor wears in the street (art/events/neighbor_*.svg). This file is that slot
     crossed out with a red X, for a run whose day 10 warning was not given on a day she won; poster_wanted.svg is the same
     sheet uncrossed. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="geometricPrecision">
  <rect x="6" y="3" width="20" height="22" fill="#c2b9a6"/>
  <rect x="8" y="5" width="16" height="2" fill="#2c2a30"/>
  <g transform="translate(8 8)">
    <rect width="7" height="5" fill="#d9d2c3"/>
    <ellipse cx="3.5" cy="1.9" rx="1.25" ry="1.4" fill="#4a403c"/>
    <rect x="3" y="3" width="1" height="0.7" fill="#4a403c"/>
    <path d="M0.8 5C1 4.1 1.8 3.6 2.7 3.5L4.3 3.5C5.2 3.6 6 4.1 6.2 5Z" fill="#4a403c"/>
    <rect x="0.25" y="0.25" width="6.5" height="4.5" fill="none" stroke="#3b3034" stroke-width="0.5"/>
  </g>
  <g transform="translate(17 8)">
    <rect width="7" height="5" fill="#d9d2c3"/>
    <ellipse cx="3.5" cy="1.9" rx="1.25" ry="1.4" fill="#4a403c"/>
    <rect x="3" y="3" width="1" height="0.7" fill="#4a403c"/>
    <path d="M0.8 5C1 4.1 1.8 3.6 2.7 3.5L4.3 3.5C5.2 3.6 6 4.1 6.2 5Z" fill="#4a403c"/>
    <rect x="0.25" y="0.25" width="6.5" height="4.5" fill="none" stroke="#3b3034" stroke-width="0.5"/>
    <path d="M0.9 0.6L6.1 4.4M6.1 0.6L0.9 4.4" stroke="#b0302a" stroke-width="1" stroke-linecap="round"/>
  </g>
  <!-- the swappable slot: the neighbor's -->
  <g id="neighbor_slot" transform="translate(8 16)">
    <rect width="7" height="5" fill="#d9d2c3"/>
    <ellipse cx="3.5" cy="1.9" rx="1.25" ry="1.4" fill="#4a403c"/>
    <path d="M2.2 1.4 Q2.3 0.45 3.5 0.45 Q4.7 0.45 4.8 1.4 Z" fill="#2a262c"/>
    <rect x="1.7" y="1.2" width="3.6" height="0.45" fill="#2a262c"/>
    <rect x="3" y="3" width="1" height="0.7" fill="#4a403c"/>
    <path d="M0.8 5C1 4.1 1.8 3.6 2.7 3.5L4.3 3.5C5.2 3.6 6 4.1 6.2 5Z" fill="#4a403c"/>
    <rect x="0.25" y="0.25" width="6.5" height="4.5" fill="none" stroke="#3b3034" stroke-width="0.5"/>
    <path d="M0.9 0.6L6.1 4.4M6.1 0.6L0.9 4.4" stroke="#b0302a" stroke-width="1" stroke-linecap="round"/>
  </g>
  <g transform="translate(17 16)">
