<!-- The dark uniform sheet: near-black, with one cream emblem invented for this game - a tall
     ring with a vertical bar through it that stands out above and below, standing on a flat
     foot bar, like the letter phi on a base - matching no real flag, party, state or movement
     mark. After the player's poster reference sheet. Same 20x22 sheet as every poster kind;
     see poster_leader.svg. Act III pastes this one edge to edge. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect x="6" y="3" width="20" height="22" fill="#2a282d"/>
  <ellipse cx="16" cy="12.6" rx="3.7" ry="4.9" fill="none" stroke="#e0d6bf" stroke-width="1.4" shape-rendering="geometricPrecision"/>
  <rect x="15" y="5" width="2" height="15" fill="#e0d6bf"/>
  <rect x="11" y="20" width="10" height="2" fill="#e0d6bf"/>
  <rect x="6.5" y="3.5" width="19" height="21" fill="none" stroke="#1a181d" stroke-width="1"/>
</svg>
