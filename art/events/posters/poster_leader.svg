<!-- The leader's portrait: a nameless, scowling, jowly middle-aged man - hair receding at the
     temples, heavy brows over a hard stare, a big nose, a mouth turned down, a dark suit with
     the white of a collar - filling a warm gray backing inside a thin cream border, with a
     large dark band across the bottom that carries no letters. Resembles nobody real. Flat
     fills with a clean dark outline, after the player's poster reference sheet.
     Every poster kind is a 20x22 sheet (62.5% x 69% of the tile) on a 32x32 canvas matching a
     wall cell's own grid: x 6..26, y 3..25, a gap on all four sides, and the bottom gap clears
     the plinth drawn from y 26 by wall_base.svg. A poster goes on blank wall, never over a
     window. -->
