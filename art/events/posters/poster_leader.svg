<!-- The leader's portrait: a nameless bust, and not a nice fellow - heavy brows pulled down to
     the nose, a hard level stare under them and a mouth turned down at both corners, over a
     dark uniform collar. Resembles nobody real. The caption band under it is a plain strip,
     never letters.
     Every poster kind is a 20x22 sheet (62.5% x 69% of the tile) on a 32x32 canvas matching a
     wall cell's own grid: x 6..26, y 3..25, a gap on all four sides, and the bottom gap clears
     the plinth drawn from y 26 by wall_base.svg. The sheet also hides the cell's window
     (window_*.svg, x 8..24, y 8..25) completely. -->
