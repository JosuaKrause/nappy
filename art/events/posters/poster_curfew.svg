  <rect x="6" y="4" width="20" height="6" fill="#221f28"/>
  <circle cx="16" cy="16" r="4" fill="none" stroke="#3b3034" stroke-width="1"/>
  <path d="M16 16L16 13 M16 16L18.4 17.2" stroke="#3b3034" stroke-width="1" stroke-linecap="round"/>
  <rect x="9" y="22" width="14" height="1" fill="#9a958a"/>
