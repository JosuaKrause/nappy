<!-- The rules: a pale printed notice with a heavy header bar, unreadable gray print lines and a
     red stamp. Same 20x25 sheet area as the other poster kinds — see poster_leader.svg. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect x="6" y="4" width="20" height="25" fill="#e8e2d4" stroke="#3b3034" stroke-width="1"/>
  <rect x="6" y="4" width="20" height="6" fill="#221f28"/>
  <rect x="9" y="13" width="14" height="1" fill="#9a958a"/>
  <rect x="9" y="16" width="11" height="1" fill="#9a958a"/>
  <rect x="9" y="19" width="13" height="1" fill="#9a958a"/>
  <rect x="9" y="22" width="9" height="1" fill="#9a958a"/>
  <g transform="rotate(-10 20 24)">
    <circle cx="20" cy="24" r="3.4" fill="#a33b34" fill-opacity="0.55" stroke="#a33b34" stroke-width="0.6"/>
    <path d="M18 23H22 M18 25H21" stroke="#a33b34" stroke-width="0.6"/>
  </g>
</svg>
