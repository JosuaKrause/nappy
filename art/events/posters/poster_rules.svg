<!-- The rules: a pale printed notice with a heavy header bar, three lines of print and a red
     stamp. Each line is a 2x3px dark bar, a 1px gap, then the 1px gray line along the bar's
     foot - "| _________" - so the sheet reads as numbered clauses without a single letter.
     Same 20x22 sheet as every poster kind; see poster_leader.svg. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect x="6" y="3" width="20" height="22" fill="#e8e2d4"/>
  <rect x="6" y="3" width="20" height="5" fill="#221f28"/>
  <rect x="8" y="10" width="2" height="3" fill="#3b3034"/>
  <rect x="11" y="12" width="13" height="1" fill="#9a958a"/>
  <rect x="8" y="14" width="2" height="3" fill="#3b3034"/>
  <rect x="11" y="16" width="10" height="1" fill="#9a958a"/>
  <rect x="8" y="18" width="2" height="3" fill="#3b3034"/>
  <rect x="11" y="20" width="12" height="1" fill="#9a958a"/>
  <g transform="rotate(-10 21 20)" shape-rendering="geometricPrecision">
    <circle cx="21" cy="20" r="2.8" fill="#a33b34" fill-opacity="0.55" stroke="#a33b34" stroke-width="0.6"/>
    <path d="M19.4 19.3H22.6 M19.4 20.8H21.8" stroke="#a33b34" stroke-width="0.6"/>
  </g>
  <rect x="6.5" y="3.5" width="19" height="21" fill="none" stroke="#3b3034" stroke-width="1"/>
</svg>
