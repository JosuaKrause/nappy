<!-- The rules: a pale printed notice under an inset dark header bar, four entries - each a
     short dark vertical bar, a one-pixel gap, then two gray print lines beside it, the second
     shorter - and a round red stamp, a ring with a thick diagonal band, over the lower right.
     No letters anywhere. After the player's poster reference sheet. Same 20x22 sheet as every
     poster kind; see poster_leader.svg. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect x="6" y="3" width="20" height="22" fill="#ebe4d2"/>
  <rect x="8" y="5" width="16" height="2" fill="#2c2a30"/>
  <rect x="8" y="8" width="2" height="3" fill="#3b3034"/>
  <rect x="11" y="8" width="13" height="1" fill="#8f8a80"/>
  <rect x="11" y="10" width="9" height="1" fill="#8f8a80"/>
  <rect x="8" y="12" width="2" height="3" fill="#3b3034"/>
  <rect x="11" y="12" width="12" height="1" fill="#8f8a80"/>
  <rect x="11" y="14" width="8" height="1" fill="#8f8a80"/>
  <rect x="8" y="16" width="2" height="3" fill="#3b3034"/>
  <rect x="11" y="16" width="13" height="1" fill="#8f8a80"/>
  <rect x="11" y="18" width="10" height="1" fill="#8f8a80"/>
  <rect x="8" y="20" width="2" height="3" fill="#3b3034"/>
  <rect x="11" y="20" width="12" height="1" fill="#8f8a80"/>
  <rect x="11" y="22" width="7" height="1" fill="#8f8a80"/>
  <g shape-rendering="geometricPrecision">
