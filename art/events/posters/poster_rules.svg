    <path d="M19.7 20.9L23.5 18.7" stroke="#a33b34" stroke-width="1.5" stroke-linecap="butt"/>
  </g>
  <rect x="6.5" y="3.5" width="19" height="21" fill="none" stroke="#3b3034" stroke-width="1"/>
</svg>
