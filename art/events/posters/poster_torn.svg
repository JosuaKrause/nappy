<!-- The leader's portrait, torn down: the top edge and the upper-left of the sheet are still
     pasted, carrying the scowling brows and the eyes, and a scrap of the bottom-right corner
     with the end of the caption band. The rest is ripped away along a jagged tear whose pale
     paper core shows as a light fringe, with a faint shadow under it. The bare wall shows
     where the sheet was, a faint shade darker than the wall round it, with dried glue smears and
     a few paper crumbs. Drawn on the 20x22 sheet every poster kind shares (x 6..26, y 3..25);
     see poster_leader.svg. Prepared for "she tears a poster down by pushing against its wall",
     M180's second item. -->
