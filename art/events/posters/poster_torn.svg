<!-- A torn poster: prepared for the tearing mechanic ("she tears a poster down by pushing
     against its wall", M180's second item). A generic sheet ripped along a jagged line — the
     top strip stays pasted, the lower piece hangs loose and rotated, and the wall shows through
     where the paper is gone. Same 20x25 sheet area as the other poster kinds — see
     poster_leader.svg — so it can stand in for any of them once tearing is built. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect x="6" y="4" width="20" height="25" fill="#9c8f7c"/>
  <path d="M6 4H26V15L20 17L15 13L10 17L6 14Z" fill="#e8e2d4" stroke="#3b3034" stroke-width="1"/>
  <rect x="6" y="4" width="20" height="6" fill="#221f28"/>
  <rect x="9" y="12" width="10" height="1" fill="#9a958a"/>
  <ellipse cx="13.5" cy="26.5" rx="5.5" ry="1.4" fill="#221f28" fill-opacity="0.3"/>
  <g transform="rotate(6 13 15)">
    <path d="M9 14L19 15L18 26L8 25Z" fill="#e8e2d4" stroke="#3b3034" stroke-width="1"/>
    <rect x="10" y="19" width="6" height="1" fill="#9a958a"/>
  </g>
</svg>
