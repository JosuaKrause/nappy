     sheet peeled from the lower left hangs off the torn strip, showing its blank back with the
     crease dark at the fold and a shadow on the wall; a scrap of the bottom-right corner keeps
     part of the red stamp. The bare wall shows where the sheet was, a faint shade darker, with glue
     smears and paper crumbs. Same 20x22 sheet as every poster kind; see poster_leader.svg.
     A variant of poster_torn.svg for the player to choose between. -->
