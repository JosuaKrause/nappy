<!-- Tear mask B: a strip across the top of the sheet stays pasted, plus a scrap of the bottom-
     right corner. Opaque where the paper stays, transparent where it is torn away; the colour
     is unused. Applied to any intact poster kind drawn on the same 20x22 sheet box (x 6..26, y
     3..25): the poster's alpha is multiplied by this mask's alpha, then
     poster_tear_b_overlay.svg is drawn on top. See docs/GRAPHICS.md, "Posters". -->
