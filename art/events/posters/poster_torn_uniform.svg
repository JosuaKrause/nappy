     corner. The tear runs top to bottom, its pale paper core a bright fringe against the dark
     print. The bare wall shows where the sheet was, a faint shade darker, with glue smears and a
     few dark paper crumbs. Same 20x22 sheet as every poster kind; see poster_leader.svg.
     A variant of poster_torn.svg for the player to choose between. -->
