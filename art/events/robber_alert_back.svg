<!-- Hooded robber on alert, back: robber_alert_front.svg from behind, the figure of
     robber_waiting_back.svg the moment he has noticed her, as he walks toward her. Both hands are out
     of the coat and held low and open at his sides, arms off the body, feet set wider: ready,
     not yet reaching; the rear of the hood hides the face opening. robber_lunging_back.svg is
     the reach itself. Canvas 26, robber_alert_front.svg's, the body 2px right of
     robber_waiting_back.svg's on its 22-wide canvas; ground anchor bottom centre (13,44).
     Walk frame a: while he warns he walks toward her in two frames, this one the planted step
     and robber_alert_back_b.svg the other, on the same canvas and anchor.
     Frame a is also the picture he holds whenever he covers no ground. -->
