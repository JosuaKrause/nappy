<!-- One repeatable segment of the closing roadblock's barrier, the one that shuts its whole
     street wall to wall (`EventDef.Look.CLOSING_ROADBLOCK`). Lower and heavier than the open
     roadblock's (`roadblock_segment.svg`), and told apart from it at a glance by two things: a
     coil of razor wire run along its top, which says nobody climbs or squeezes past, and a panel of
     square red and cream blocks where the open one has diagonal stripes. Same canvas as the open
     segment, so the guards' posts (`EventFootprints.guard_post_offset()`) stand clear of it the
     same way. It tiles: the wire's loops repeat every 5.5px and the panel's blocks every 11px, both
     whole fractions of the width, and every concrete plane runs edge to edge with no stroke of its
     own, so two segments meet with no seam. Feet-anchored at the bottom centre. -->
<svg xmlns="http://www.w3.org/2000/svg" width="22" height="30" viewBox="0 0 22 30" shape-rendering="geometricPrecision">
  <!-- The wire: overlapping loops, a dark line with a lit one just above it. -->
  <g fill="none" stroke="#3f3d45" stroke-width="1.1">
    <circle cx="0" cy="7.4" r="5.2"/>
    <circle cx="5.5" cy="7.4" r="5.2"/>
    <circle cx="11" cy="7.4" r="5.2"/>
    <circle cx="16.5" cy="7.4" r="5.2"/>
    <circle cx="22" cy="7.4" r="5.2"/>
  </g>
  <g fill="none" stroke="#b9b8b4" stroke-width="0.5" stroke-opacity="0.85">
    <circle cx="0" cy="6.9" r="5.2"/>
    <circle cx="5.5" cy="6.9" r="5.2"/>
    <circle cx="11" cy="6.9" r="5.2"/>
    <circle cx="16.5" cy="6.9" r="5.2"/>
    <circle cx="22" cy="6.9" r="5.2"/>
  </g>
  <!-- The concrete: a lit cap, the body, the block panel, the dark foot. -->
  <rect x="0" y="12" width="22" height="3.5" fill="#a5a59d" stroke="none"/>
  <rect x="0" y="15.5" width="22" height="11.5" fill="#85857f" stroke="none"/>
  <rect x="0" y="17.5" width="22" height="7" fill="#e0d8c4" stroke="none"/>
  <rect x="0" y="17.5" width="5.5" height="7" fill="#c4503c" stroke="none"/>
  <rect x="11" y="17.5" width="5.5" height="7" fill="#c4503c" stroke="none"/>
  <rect x="0" y="24.5" width="22" height="0.8" fill="#3b2020" fill-opacity="0.25" stroke="none"/>
  <rect x="0" y="27" width="22" height="3" fill="#221f28" stroke="none" opacity="0.72"/>
</svg>
