<!-- Hooded robber on alert, front: the figure of robber_waiting_front.svg the moment he has
     noticed her, before he moves. Both hands are out of the coat and held low and open at his
     sides, arms off the body, feet set wider: ready, not yet reaching. robber_lunging_front.svg
     is the reach itself, one hand thrust out and the stride thrown. Canvas widened to 26 for
     the arms; ground anchor bottom centre (13,44). -->
