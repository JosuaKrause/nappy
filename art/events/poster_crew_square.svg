<!-- The square's poster crew, as one silhouette for the screen-edge badge. The column is what tells
     it apart from the sidewalk crew's own badge at a glance, so it carries the sheet and the man
     stands at it with his brush; the figure is `poster_crew.svg`'s, unaltered. Compact canvas
     rather than the family's 44px one, since a badge is drawn small in its own box. -->
