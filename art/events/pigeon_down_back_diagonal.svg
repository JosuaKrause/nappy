<!-- The pigeon, back diagonal view, the downstroke, wings swept down; also the frame a standing bird is drawn with. One of PIGEON_BY_VIEW / PIGEON_DOWN_BY_VIEW in
     EventInstance, chosen per bird from its own heading. The same rock dove as pigeon.svg
     from this side. Faces north-east, away from the viewer and to the right;
     EventInstance mirrors it for north-west. Canvas 22x18, ground anchor bottom centre
     (11,18), feet on the bottom edge.
     Body, head, tail and feet are the same paths as its pigeon partner for this view,
     so the two frames register exactly; only the wings move. -->
