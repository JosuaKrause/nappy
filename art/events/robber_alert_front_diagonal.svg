<!-- Hooded robber on alert, front diagonal: robber_alert_front.svg turned to the south-east,
     the figure of robber_waiting_front_diagonal.svg the moment he has noticed her, as he walks
     toward her. Both hands are out of the coat, held low and open: the near arm off the body with
     its hand beside his hip, the far hand showing past his front; the stance is wider than his
     waiting one. Ready, not yet reaching: robber_lunging_front_diagonal.svg is the reach.
     East-authored like the rest of the family; EventInstance mirrors it for south-west. Canvas
     26, robber_alert_front.svg's, the body 2px right of robber_waiting_front_diagonal.svg's on
     its 22-wide canvas; ground anchor bottom centre (13,44).
     Walk frame a: while he warns he walks toward her in two frames, this one the planted step
     and robber_alert_front_diagonal_b.svg the other, on the same canvas and anchor.
     Frame a is also the picture he holds whenever he covers no ground. -->
<svg xmlns="http://www.w3.org/2000/svg" width="26" height="44" viewBox="0 0 26 44" shape-rendering="geometricPrecision" stroke="#3b2d32" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round">
