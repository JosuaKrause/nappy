<!-- Policeman on foot about to charge, front_diagonal: the man of policeman_waiting_front_diagonal.svg the moment he has got out of a vehicle beside her, before he moves. Planted, feet wider, his far hand raised palm out in front of his face at head height, his near arm down: *stop there*, the guard's alert (guard_alert_front_diagonal.svg) in a policeman's coat. policeman_lunging_front_diagonal.svg is the charge. East-authored like the rest of the family; EventInstance mirrors it for the west. Canvas widened to 26, 2px each side, for the hand, and the whole figure moved +2 with it, so the body stands exactly where policeman_waiting_front_diagonal.svg's does over the same bottom-centre ground anchor (13,44 here, 11,44 there) and does not step at the swap. -->
