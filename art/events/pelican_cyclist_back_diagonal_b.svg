<!-- Pelican cyclist, three-quarter back. The other pedal position. The pelican that one cyclist in about four hundred is instead (EventInstance's
     PELICAN_BY_VIEW / PELICAN_BY_VIEW_B, chosen per rider when it spawns). The bike is the
     cyclist's own, path for path, so the two share wheels, ground contact and registration and
     only the rider changes: a great white pelican, white with black wing tips gripping the
     bars, a long yellow bill with an orange pouch, orange webbed feet on the pedals.
     The pouch and bill carry the read at game scale. SVG only by the player's word: no
     illustrated PNG is ever made of it; the atlas bake rasterizes it like any SVG.
     Canvas 40x44, the cyclist's own for this view; bottom-centre ground anchor (20,44). -->
<svg xmlns="http://www.w3.org/2000/svg" width="40" height="44" viewBox="0 0 40 44" shape-rendering="geometricPrecision" stroke="#3b2d32" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round">
  <ellipse cx="8" cy="36" rx="4.5" ry="6" fill="none" stroke="#221f28" stroke-width="1.6"/><ellipse cx="29" cy="28" rx="4.5" ry="6" fill="none" stroke="#221f28" stroke-width="1.6"/>
  <!-- The far leg is behind the bicycle tubes; the near leg is in front. -->
  <path d="M20.2 23 L25.2 27.4 L22.8 32.2" fill="none" stroke="#3b2d32" stroke-width="2"/>
  <path d="M20.2 23 L25.2 27.4 L22.8 32.2" fill="none" stroke="#b8683a" stroke-width="1.1"/>
  <path d="M22.0 32.3 L25.0 31.0 L25.6 32.2 L24.6 33.0 L22.2 33.2 Z" fill="#e0843a" stroke-width="0.6"/>
  <path d="M8 36 L16 25 L20 32 L8 36 M16 25 L27 22 L20 32 L29 28 L27 20" fill="none" stroke="#c4503c" stroke-width="1.8"/>
  <path d="M25 20 L32 18" fill="none" stroke="#221f28" stroke-width="1.6"/>
  <!-- Each leg bends forward from its hip, with the ankle resting on its pedal. -->
  <path d="M16 23.6 L21 25.8 L18.6 30.2" fill="none" stroke="#3b2d32" stroke-width="2"/>
  <path d="M16 23.6 L21 25.8 L18.6 30.2" fill="none" stroke="#e0843a" stroke-width="1.1"/>
  <path d="M17.8 30.3 L20.8 29.0 L21.4 30.2 L20.4 31.0 L18.0 31.2 Z" fill="#e0843a" stroke-width="0.6"/>
