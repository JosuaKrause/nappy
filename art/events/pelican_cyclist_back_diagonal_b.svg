  <path d="M23 12 C26 12.8 29.4 15.2 31.4 18 L29.2 19.4 C27.8 17.2 25.4 15.6 22.8 14.8 Z" fill="#ddd5c6"/>
  <path d="M29 16.2 L32 17.6 L32 19 L29.2 19.8 L28 18 Z" fill="#2f2a30"/>
