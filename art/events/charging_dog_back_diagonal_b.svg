     EventInstance: the same animal as charging_dog.svg (dark coat with tan points, ears
     pinned back, raised hackles, head low, the open red jaw) from this side, drawn in the
     walked dog's idiom so the two read as two different dogs rather than two styles.
     Faces north-east, away from the viewer and to the right; EventInstance
     mirrors it for north-west. A corner of the red jaw still shows past the cheek.
     Canvas 38x28, ground anchor bottom centre (19,28); the near hind paw stands on the
     canvas bottom.
     The a and b frames share every body path; only the legs move. -->
