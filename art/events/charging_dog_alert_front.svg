<!-- The charging dog on alert, front view: charging_dog_alert.svg from this side, the same
     animal as charging_dog_front.svg the moment it has noticed her. Squared up on four stiff
     straight legs, head held high, ears pricked straight up, the hackles standing on the
     shoulders behind the head, lips drawn back off white teeth with the jaw still shut; the
     open red jaw stays the charge's own. Canvas 30x28, ground anchor bottom centre (15,28), the
     canvas charging_dog_front.svg uses. -->
