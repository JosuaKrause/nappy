<!-- A hard seal on a north-south street: the main under the carriageway has split, the asphalt
     above it has heaved up into broken slabs around a crater, water fountains out of the break and
     spreads across the road towards both kerbs, and a municipal barrier stands at each end.
     The second of the scene's two frames: the fountain surging and splashing, the puddle's
     glints moved; everything else identical to `burst_water_main.svg`.
     Native width 200 over the 192px this row obstructs, drawn once by `_draw_wide_scene` the same
     way fallen_tree.svg is, bottom edge on the ground point. The ground (puddle, crater, slabs) is
     seen from overhead with the far inner wall showing; the fountain and the barriers stand upright
     and are seen from the front. No shadow anywhere: the crater is sunk into the road. -->
