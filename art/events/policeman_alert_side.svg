<!-- Policeman on foot about to charge, side: the man of policeman_waiting_side.svg the moment he has got out of a vehicle beside her, before he moves. Planted, feet wider, the near arm raised forward with the palm out in front of his face: *stop there*, the guard's alert (guard_alert_side.svg) in a policeman's coat. policeman_lunging_side.svg is the charge. East-authored like the rest of the family; EventInstance mirrors it for the west. Canvas widened to 26, 2px each side, for the hand, and the whole figure moved +2 with it, so the body stands exactly where policeman_waiting_side.svg's does over the same bottom-centre ground anchor (13,44 here, 11,44 there) and does not step at the swap. -->
