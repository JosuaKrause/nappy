<!-- The one thing in the game you cannot walk away from, so the silhouette has to say *coming
     at you* rather than *dog*. Read against dog.svg, which is a pet braced on a lead: light
     tan, soft hanging ears, tail up, a collar. This one is a heavier, darker animal with tan
     points, ears pinned flat back, the hackles standing up along its shoulders, stretched out
     low with the head down level with the back, tail straight out behind, and it is half again
     as long. The open jaw is the only red on it: the one detail that says the difference
     between a dog running past and a dog running at. Faces east; EventInstance mirrors it for a
     westward heading. Canvas 40x22, ground anchor bottom centre (20,22). This frame is the
     gallop's full stretch, legs thrown front and back; charging_dog_b.svg is the same body
     gathered, all four legs bunched under it. -->
