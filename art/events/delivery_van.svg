<!-- A delivery van at the kerb, seen from the side, facing west: the boxy panel van of its own
     `delivery_van_{front,back,front_diagonal,back_diagonal}.svg` in profile, in their colours —
     the lit roof edge, the blue-grey flank, the dark sill — with the cab's door and window at
     the front, a sliding cargo door with a pale reflection, the rear doors' seam, and the
     hazards on. `_draw_eight_view` mirrors it (`side_faces_west`) for the row's always-east
     heading. This was `vehicle.svg` and it was drawn for *every* VEHICLE event until M37 — a fire
     engine, a police car, a riot van, an army truck and the unmarked van that takes the baby
     were all this picture. The colour is baked rather than modulated: multiplying would tint the
     tyres and the windscreen too. Feet-anchored at the bottom centre. -->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="30" viewBox="0 0 48 30" shape-rendering="geometricPrecision" stroke="#3b2d32" stroke-width="1" stroke-linejoin="round" stroke-linecap="round">
  <!-- The box: flank, a lit strip of roof along its top, the dark sill and bumpers below. -->
  <path d="M2.4 23.6 L2 13 L3.2 10.8 L6.4 4 Q7 3 8.2 3 L45 3 Q46 3 46 4 L46 23.6 Z" fill="#6b7a8c"/>
  <path d="M7.4 3.4 L45.6 3.4 L45.6 5.4 L6.4 5.4 Z" fill="#7d8a9a" stroke="none"/>
  <path d="M2.2 19.6 L46 19.6 L46 23.6 L2.4 23.6 Z" fill="#221f28"/>
  <path d="M2.4 23.6 L2 13 L3.2 10.8 L6.4 4 Q7 3 8.2 3 L45 3 Q46 3 46 4 L46 23.6 Z" fill="none" stroke-width="1.2"/>
  <!-- The cab: its door, its window and the mirror. -->
  <path d="M6.4 5.8 L15 5.8 L15 12.4 L3.8 12.4 Z" fill="#2f3742"/>
  <path d="M7.4 7 L10.4 7 L7.2 11.2 L5.4 11.2 Z" fill="#556779" stroke="none"/>
  <path d="M16.4 5 L16.4 19.4" fill="none"/>
  <path d="M12.4 14.2 L14.4 14.2" fill="none" stroke="#221f28" stroke-width="1"/>
  <path d="M2.8 9.6 L1 9.6 L1 12.4 L2.6 12.4" fill="#26232a" stroke-width="0.8"/>
  <!-- The sliding cargo door, its rail and the pale reflection along it. -->
  <path d="M19.4 5.4 L31.4 5.4 L31.4 19.4 L19.4 19.4 Z" fill="none"/>
  <path d="M20.6 7.2 L30.2 7.2" fill="none" stroke="#aeb8c2" stroke-width="1"/>
  <path d="M29 12.6 L30.6 12.6" fill="none" stroke="#221f28" stroke-width="1"/>
  <path d="M17.8 17.6 L44.6 17.6" fill="none" stroke="#4e5866" stroke-width="0.9"/>
  <!-- The rear doors' seam. -->
  <path d="M43.8 5.4 L43.8 19.4" fill="none" stroke="#4e5866" stroke-width="0.9"/>
  <!-- Lamps: a headlight and a flashing indicator at the front, a tail lamp and a flashing
       indicator at the back. -->
  <path d="M2.2 14 L4.6 14 L4.6 16.4 L2.3 16.4 Z" fill="#e8ddc8" stroke-width="0.8"/>
  <path d="M2.1 11.6 L3.6 11.6 L3.6 13.2 L2.1 13.2 Z" fill="#e8b64a" stroke-width="0.6"/>
  <path d="M44.4 13.2 L46.8 13.2 L46.8 16.2 L44.4 16.2 Z" fill="#c4503c" stroke-width="0.8"/>
  <path d="M44.4 10.4 L46.8 10.4 L46.8 12.6 L44.4 12.6 Z" fill="#e8b64a" stroke-width="0.8"/>
  <!-- Wheels in their arches. -->
  <path d="M5.2 23.6 Q5.2 17.6 11 17.6 Q16.8 17.6 16.8 23.6 Z M31.2 23.6 Q31.2 17.6 37 17.6 Q42.8 17.6 42.8 23.6 Z" fill="#141419" stroke="none"/>
  <circle cx="11" cy="24.6" r="4.8" fill="#26232a"/>
  <circle cx="37" cy="24.6" r="4.8" fill="#26232a"/>
  <circle cx="11" cy="24.6" r="1.9" fill="#6a6570"/>
  <circle cx="37" cy="24.6" r="1.9" fill="#6a6570"/>
</svg>
