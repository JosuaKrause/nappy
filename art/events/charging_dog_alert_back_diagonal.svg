     viewer, the same animal as charging_dog_back_diagonal.svg the moment it has noticed her. Up
     on four stiff straight legs, the hackles standing along its shoulders, the tail held up
     stiff, the head raised and pointed away with both ears pricked straight up; no red shows,
     since the jaw is shut. Faces north-east, away from the viewer and to the right;
     EventInstance mirrors it for north-west. Canvas 38x28, ground anchor bottom centre (19,28),
     the canvas charging_dog_back_diagonal.svg uses; the near hind paw stands on the canvas
     bottom. -->
