<!-- Pelican cyclist, three-quarter front, riding down and to the right. The pelican that one cyclist in about four hundred is instead (EventInstance's
     PELICAN_BY_VIEW / PELICAN_BY_VIEW_B, chosen per rider when it spawns). The bike is the
     cyclist's own, path for path, so the two share wheels, ground contact and registration and
     only the rider changes: a great white pelican, white with black wing tips gripping the
     bars, a long yellow bill with an orange pouch, orange webbed feet on the pedals.
     The pouch and bill carry the read at game scale. SVG only by the player's word: no
     illustrated PNG is ever made of it; the atlas bake rasterizes it like any SVG.
     Canvas 40x44, the cyclist's own for this view; bottom-centre ground anchor (20,44). -->
<svg xmlns="http://www.w3.org/2000/svg" width="40" height="44" viewBox="0 0 40 44" shape-rendering="geometricPrecision" stroke="#3b2d32" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round">
