<!-- One segment of a blocking object. Repeated across the obstruction's width, so what is
     drawn is exactly what is in the way.
     Red-and-white hazard stripes, the same reason a municipal barrier is painted that way in the
     street: playtest 19, "no clue what they are supposed to be." Diagonal, same as `checkpoint`'s
     own red-and-cream band, so the two read as kin — a street being mended rather than a street
     being held — without ever sharing a picture. The burst main's barriers carry the same board.
     A striped board on a leg, broadside on. It tiles: the board runs edge to edge with no end
     line, the stripes repeat every 11px so both edges meet the neighbour's on the same phase,
     and each segment stands on one leg at its middle, so the legs fall evenly along the line.
     Feet-anchored at the bottom centre; `barrier_end.svg` posts cap the two ends. -->
<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22" shape-rendering="geometricPrecision" stroke="#2a2226" stroke-width="1" stroke-linejoin="round" stroke-linecap="round">
  <defs>
    <clipPath id="rw-seg-board">
      <rect x="0" y="3" width="22" height="12"/>
    </clipPath>
  </defs>
  <!-- One leg under the middle of the board, on a foot. -->
  <path d="M11 14 L11 20.6" fill="none" stroke="#2a2226" stroke-width="3"/>
  <path d="M11 14 L11 20.4" fill="none" stroke="#6b6357" stroke-width="1.4"/>
  <path d="M7.6 21 L14.4 21" fill="none" stroke="#2a2226" stroke-width="1.8"/>
  <!-- The board: cream, red diagonal stripes, lit along its top, shaded along its foot. -->
  <rect x="0" y="3" width="22" height="12" fill="#e8dfc8" stroke="none"/>
  <g clip-path="url(#rw-seg-board)" stroke="none">
    <path d="M-11 3 L-5.5 3 L0.5 15 L-5 15 Z M0 3 L5.5 3 L11.5 15 L6 15 Z M11 3 L16.5 3 L22.5 15 L17 15 Z M22 3 L27.5 3 L33.5 15 L28 15 Z" fill="#c4503c"/>
    <path d="M0 12 L22 12 L22 15 L0 15 Z" fill="#3b2020" fill-opacity="0.24"/>
    <path d="M0 4.3 L22 4.3" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="0.9"/>
  </g>
  <path d="M0 3 L22 3 M0 15 L22 15" fill="none" stroke-width="1.2"/>
</svg>
