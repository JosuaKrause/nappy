<!-- The charging dog on alert, side view: the same animal as charging_dog.svg the moment it
     has noticed her, before it runs. Up on four stiff straight legs, head raised high and
     pointed at her, ears pricked straight up, the hackles standing along its shoulders, the
     tail held up stiff, and the lips drawn back off white teeth with the jaw still shut. The
     open red jaw stays the charge's own: this frame shows the teeth and not the bite. Read
     against dog_resting.svg (sitting, soft) and charging_dog.svg (stretched out mid-gallop).
     Faces east; mirrored for a westward heading. Canvas 40x22, ground anchor bottom centre
     (20,22), the canvas charging_dog.svg uses. -->
