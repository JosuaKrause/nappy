<!-- One pigeon on the upstroke. Paired with `pigeon_down.svg`, which is the same bird with its
     wings swept down: a flock is drawn as N of these, each on its own beat, so what shows is a
     dozen individual birds rather than one shape repeated. A rock dove: blue-gray, a darker
     head, a green and purple sheen on the neck, two dark bars on each wing, a dark band at the
     end of the tail, pink feet. Faces east; EventInstance mirrors it per bird for a westward
     heading. Canvas 18x14, ground anchor bottom centre (9,14), feet on the bottom edge.
     Body, head, tail and feet are the same paths in both frames; only the wings move. -->
