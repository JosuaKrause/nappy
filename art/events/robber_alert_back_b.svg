<!-- Hooded robber on alert, back, walk frame b: robber_alert_back.svg's partner in his
     two-frame walk while he warns, robber_alert_front_b.svg from behind. robber_alert_back.svg
     is the planted step, feet wide and both arms held off the body; this is the passing step:
     the feet drawn in under him with one foot lifted off the ground and the arms brought in,
     one hanging close beside the coat with its hand showing, the other swung forward in front
     of him, so only its upper arm shows past the coat. The rear of the hood hides the face
     opening. Torso and hood are robber_alert_back.svg's, unmoved. Canvas 26x44, ground anchor
     bottom centre (13,44), the partner's, so the cycle does not jump. -->
