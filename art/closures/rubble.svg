  <path d="M2 33 L6 26 L12 22 L16 16 L24 13 L30 8 L38 6 L46 9 L52 8 L58 13 L66 15 L72 21 L78 24 L84 33 Z" fill="#6b6357" stroke-width="1.2"/>
