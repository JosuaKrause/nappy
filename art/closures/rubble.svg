<!-- A facade in the road. Act IV: the street is closed because it fell down. A heap of broken
     masonry: a slab of brick wall still in its courses, a window with its frame, a concrete
     floor slab, a timber beam, bent reinforcing bars and loose bricks, over a mound of dusty
     concrete. `ClosureMarker` draws it feet-anchored at the bottom centre with its own point
     shadow under it, so none is drawn here. -->
<svg xmlns="http://www.w3.org/2000/svg" width="86" height="34" viewBox="0 0 86 34" shape-rendering="geometricPrecision" stroke="#2a2226" stroke-width="1" stroke-linejoin="round" stroke-linecap="round">
