  <path d="M1.6 23H8.4" stroke-width="1.8"/>
  <path d="M3.4 1.8H6.6V22.4H3.4Z" fill="#8a8378" stroke-width="1"/>
  <path d="M4 2.4V21.8" stroke="#d2c7af" stroke-width="0.7"/>
  <path d="M3 1H7V3H3Z" fill="#6b6357" stroke-width="0.8"/>
</svg>
