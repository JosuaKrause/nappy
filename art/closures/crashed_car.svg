<!-- Two cars that met head on, slewed across the carriageway: the red one in front with its nose
     crushed and its hood sprung up, the blue one behind, nudged back and up the road, crushed to
     match. Steam from the wreck, glass, a bumper and a hubcap on the road. Both are the crowd
     cars' profile, drawn with their fronts folded in. `ClosureMarker` draws it feet-anchored at
     the bottom centre with its own point shadow under it, so none is drawn here. -->
<svg xmlns="http://www.w3.org/2000/svg" width="80" height="38" viewBox="0 0 80 38" shape-rendering="geometricPrecision" stroke="#2a2226" stroke-width="1" stroke-linejoin="round" stroke-linecap="round">
  <!-- The blue car, behind, facing west: its own profile mirrored, front folded in. -->
  <g transform="translate(79 10) scale(-0.78 0.78)" stroke-width="1.3">
    <path d="M2 11 Q4 9 10 9 L15 3 Q18 1 35 2 L40 8.5 L44 9.5 L46.5 12 L44.8 14 L48.5 16 L46 18.5 L48 22 L3 22 Q1 18 2 11 Z" fill="#5d6f8a"/>
    <path d="M12 9 L17 3 Q25 1 35 3 L40 9 Z" fill="#7486a0" stroke="none"/>
    <path d="M2.4 18 Q22 20 46.6 18.6 L48 22 L3 22 Z" fill="#46546a" stroke="none"/>
    <path d="M14 9 L19 4 L25 4 L25 9 Z M27 4 L34 4 L38 9 L27 9 Z" fill="#2f3742"/>
    <path d="M16 8 L20 5 L24 5 L24 8 Z M28 5 L33 5 L36 8 L28 8 Z" fill="#556779" stroke="none"/>
    <path d="M30 5 L32 8 M32 6.2 L34.4 5.4" fill="none" stroke="#cfe3ea" stroke-width="0.9"/>
    <path d="M29 12.5 L32 14.5 L30 16.5 M40 11 L42.5 13" fill="none" stroke="#2f3a4a" stroke-width="1"/>
    <path d="M2 12 L5 12 L5 15 L2 15 Z" fill="#a8443a"/>
    <path d="M2 11 Q4 9 10 9 L15 3 Q18 1 35 2 L40 8.5 L44 9.5 L46.5 12 L44.8 14 L48.5 16 L46 18.5 L48 22 L3 22 Q1 18 2 11 Z" fill="none"/>
    <circle cx="14" cy="24" r="5" fill="#26232a"/>
    <circle cx="38" cy="24" r="5" fill="#26232a"/>
    <circle cx="14" cy="24" r="2" fill="#6a6570"/>
    <circle cx="38" cy="24" r="2" fill="#6a6570"/>
  </g>
  <!-- The red car, in front, facing east: nose crushed, hood sprung up, windscreen cracked. -->
  <g transform="translate(1 14) scale(0.78)" stroke-width="1.3">
    <path d="M2 11 Q4 9 10 9 L15 3 Q18 1 35 2 L40 8.5 L44 9.5 L46.5 12 L44.8 14 L48.5 16 L46 18.5 L48 22 L3 22 Q1 18 2 11 Z" fill="#a8503f"/>
    <path d="M12 9 L17 3 Q25 1 35 3 L40 9 Z" fill="#c26a57" stroke="none"/>
    <path d="M2.4 18 Q22 20 46.6 18.6 L48 22 L3 22 Z" fill="#83392d" stroke="none"/>
    <path d="M14 9 L19 4 L25 4 L25 9 Z M27 4 L34 4 L38 9 L27 9 Z" fill="#2f3742"/>
    <path d="M16 8 L20 5 L24 5 L24 8 Z M28 5 L33 5 L36 8 L28 8 Z" fill="#556779" stroke="none"/>
    <path d="M31 5 L33 8 M33 6 L35.6 5.2 M33 8 L35.4 8.6" fill="none" stroke="#cfe3ea" stroke-width="0.9"/>
    <path d="M30 12.5 L33 14.5 L31 16.5" fill="none" stroke="#6a2a21" stroke-width="1"/>
    <path d="M2 12 L5 12 L5 15 L2 15 Z" fill="#e0862a"/>
