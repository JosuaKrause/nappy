<!-- What is in the middle of the street: a trench cut in the asphalt, its spoil heap with a
     shovel left in it, a length of concrete pipe waiting to go in and a traffic cone. The trench
     is seen from above with its far wall showing; the heap, the pipe and the cone stand up from
     the road. `ClosureMarker` draws it feet-anchored at the bottom centre and puts its own point
     shadow under it, so none is drawn here. -->
