<!-- The sign on the middle panel of a barrier. This is the whole of the legibility promise:
     it faces the junction, so the street is readable as shut from the last place the route
     can still change. A red plate with a white bar and a white reflective rim on a steel
     post, clamped to the barrier; `ClosureMarker` draws it standing 2px in front of the panel
     so it shares the panel's y. Feet-anchored at the bottom centre. -->
<svg xmlns="http://www.w3.org/2000/svg" width="20" height="34" viewBox="0 0 20 34" shape-rendering="geometricPrecision" stroke="#2a2226" stroke-width="1" stroke-linejoin="round" stroke-linecap="round">
  <!-- The post, lit down its left side, with the clamp that holds it to the rail. -->
  <path d="M8.8 15 L11.2 15 L11.2 33.4 L8.8 33.4 Z" fill="#6b6357"/>
  <path d="M9.6 15.6 L9.6 33" fill="none" stroke="#a39b8e" stroke-width="0.7"/>
  <path d="M7.8 24 L12.2 24 L12.2 26.4 L7.8 26.4 Z" fill="#3a3436" stroke-width="0.8"/>
  <!-- The plate: white rim, red face shaded along its foot, white bar, two bolts. -->
  <path d="M2.4 1 L17.6 1 Q19 1 19 2.4 L19 15.6 Q19 17 17.6 17 L2.4 17 Q1 17 1 15.6 L1 2.4 Q1 1 2.4 1 Z" fill="#f2eee4" stroke-width="1.2"/>
  <path d="M3.4 2.6 L16.6 2.6 Q17.4 2.6 17.4 3.4 L17.4 14.6 Q17.4 15.4 16.6 15.4 L3.4 15.4 Q2.6 15.4 2.6 14.6 L2.6 3.4 Q2.6 2.6 3.4 2.6 Z" fill="#c23b32" stroke="none"/>
  <path d="M2.6 12.4 L17.4 12.4 L17.4 14.6 Q17.4 15.4 16.6 15.4 L3.4 15.4 Q2.6 15.4 2.6 14.6 Z" fill="#6e1c1a" fill-opacity="0.35" stroke="none"/>
  <path d="M3.8 3.8 L10 3.8" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="0.8"/>
  <path d="M4.6 7.4 L15.4 7.4 L15.4 10.6 L4.6 10.6 Z" fill="#f2eee4" stroke-width="0.9"/>
  <circle cx="10" cy="4.6" r="0.5" fill="#8a8378" stroke="none"/>
  <circle cx="10" cy="13.4" r="0.5" fill="#8a8378" stroke="none"/>
</svg>
