<!-- One stretch of the police cordon's tape seen broadside, for a cordon line running across the
     screen (day 12's park, `ParkCordon`). A ribbon pulled taut at hip height between two
     `cordon_post.svg` stanchions: police blue and white in diagonal bands, the police car's own
     two colours, so it reads as the police rather than as the amber park fence or the red
     roadworks board. A ribbon rather than a board or a rail: nothing stands under it but the
     faint line of its shadow on the grass. It tiles: the bands repeat every 8px, so a stretch
     drawn edge to edge with its neighbour meets it on the same phase, and the ribbon has no end
     line. Feet-anchored at the bottom centre; the ribbon runs from 13.6 to 17px above the feet,
     the height `cordon_post.svg` carries it at. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="22" viewBox="0 0 32 22" shape-rendering="geometricPrecision" stroke-linejoin="round" stroke-linecap="round">
  <defs>
    <clipPath id="cordon-across-ribbon">
      <rect x="0" y="5" width="32" height="3.4"/>
    </clipPath>
  </defs>
  <!-- The ribbon's shadow on the ground under it. -->
  <path d="M0 21.2 L32 21.2" fill="none" stroke="#211d1c" stroke-opacity="0.18" stroke-width="1.4"/>
  <!-- The ribbon: white, police blue bands slanting across it, a little shade along its foot. -->
  <rect x="0" y="5" width="32" height="3.4" fill="#e8ecf0"/>
  <g clip-path="url(#cordon-across-ribbon)">
    <path d="M-4 5 L0 5 L-2 8.4 L-6 8.4 Z M4 5 L8 5 L6 8.4 L2 8.4 Z M12 5 L16 5 L14 8.4 L10 8.4 Z M20 5 L24 5 L22 8.4 L18 8.4 Z M28 5 L32 5 L30 8.4 L26 8.4 Z M36 5 L40 5 L38 8.4 L34 8.4 Z" fill="#31497a"/>
    <path d="M0 7.4 L32 7.4 L32 8.4 L0 8.4 Z" fill="#22304f" fill-opacity="0.28"/>
  </g>
  <path d="M0 5 L32 5 M0 8.4 L32 8.4" fill="none" stroke="#22304f" stroke-width="0.7"/>
</svg>
