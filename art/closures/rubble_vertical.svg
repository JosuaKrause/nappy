<!-- The fallen facade of `rubble.svg` across an east-west street: the heap lies north to south,
     away from the camera, so the same wreckage is drawn again in the game's own projection rather
     than turned. A long mound of dusty concrete runs down the screen, its crest along the middle
     and its near end facing us; on it lie the same pieces: a slab of brick wall still in its
     courses, a window with its frame, a concrete floor slab, a timber beam, bent reinforcing bars
     and loose bricks at its foot. Feet-anchored at the bottom centre; the heap lies along the
     bottom 86px of the canvas, the same length of road `rubble.svg` spans across a north-south
     street, and `ClosureMarker` stands it half that below the street's middle so it is centred
     there, with its own ground shadow under it; none is drawn here. -->
