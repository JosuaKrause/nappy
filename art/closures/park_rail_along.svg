<!-- A park fence rail seen along its length, not a broadside board turned on its side.
     Canvas 6x22: the narrow top plane runs from y0 to y16.4; the upright end face is
     5.6px high. Runtime repeats the top plane along the ground and preserves the end face
     height. Upper and lower rails share x and are separated in screen y by their elevation.
     Runtime places the near top edge 21px above the ground for the upper rail and
     12.6px for the lower, whose end face is 5.2px high. Both share ground x=3. -->
<svg xmlns="http://www.w3.org/2000/svg" width="6" height="22" viewBox="0 0 6 22">
  <path d="M1 0H5V22H1Z" fill="#2a2226"/>
  <path d="M1.6 0H4.4V16.4H1.6Z" fill="#ece6d6"/>
  <path d="M1.6 0H4.4V4.1H1.6Z M1.6 8.2H4.4V12.3H1.6Z" fill="#e0862a"/>
  <path d="M1.6 0H2.3V16.4H1.6Z" fill="#ffffff" fill-opacity="0.38"/>
  <path d="M3.8 0H4.4V16.4H3.8Z" fill="#3b2410" fill-opacity="0.26"/>
  <path d="M1.6 16.4H4.4V21.4H1.6Z" fill="#bc7129"/>
  <path d="M1.6 16.4H4.4" stroke="#f4dcac" stroke-width="0.7"/>
</svg>
