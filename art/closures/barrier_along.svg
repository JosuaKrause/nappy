<!-- The same barrier seen along its length, for the mouth of an east-west street: in this
     oblique view a fence running away from the camera projects to a vertical band, so it is
     drawn as one and tiled down the screen. `ClosureMarker._draw_panel` stacks these with no
     gap, each stretched to its share of the street, so the two rails run the full height with no
     end line, their amber stripes repeat every 13px (twice per panel) so every seam meets on the
     same phase, and each panel carries one post's foot, braced out to either side, at its
     bottom: one continuous barrier on repeated feet rather than a stack of separate panels.
     Everything striped is clipped inside the rails. Feet-anchored at the bottom centre. -->
<svg xmlns="http://www.w3.org/2000/svg" width="14" height="26" viewBox="0 0 14 26" shape-rendering="geometricPrecision" stroke="#2a2226" stroke-width="1" stroke-linejoin="round" stroke-linecap="round">
  <defs>
    <clipPath id="closure-along-rails">
      <path d="M3 0 L6.6 0 L6.6 26 L3 26 Z M7.4 0 L11 0 L11 26 L7.4 26 Z"/>
    </clipPath>
  </defs>
  <!-- A post's foot, braced out to either side of the rails. -->
  <path d="M5 18.5 L1.4 24.6 M9 18.5 L12.6 24.6" fill="none" stroke="#2a2226" stroke-width="3"/>
  <path d="M5 18.5 L1.4 24.6 M9 18.5 L12.6 24.6" fill="none" stroke="#8a8378" stroke-width="1.4"/>
  <path d="M0.6 25 L2.8 25 M11.2 25 L13.4 25" fill="none" stroke="#2a2226" stroke-width="1.6"/>
  <!-- The two rails, end-on: a dark gap between them, white with amber stripes slanting across,
       lit down the left of each and shaded down the right. -->
  <path d="M3 0 L11 0 L11 26 L3 26 Z" fill="#2a2226" stroke="none"/>
  <path d="M3 0 L6.6 0 L6.6 26 L3 26 Z M7.4 0 L11 0 L11 26 L7.4 26 Z" fill="#ece6d6" stroke="none"/>
  <g clip-path="url(#closure-along-rails)" stroke="none">
    <path d="M3 -13 L3 -6.5 L11 -3 L11 -9.5 Z M3 0 L3 6.5 L11 10 L11 3.5 Z M3 13 L3 19.5 L11 23 L11 16.5 Z M3 26 L3 32.5 L11 36 L11 29.5 Z" fill="#e0862a"/>
    <path d="M5.6 0 L6.6 0 L6.6 26 L5.6 26 Z M10 0 L11 0 L11 26 L10 26 Z" fill="#3b2410" fill-opacity="0.26"/>
    <path d="M3.9 0 L3.9 26 M8.3 0 L8.3 26" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="0.8"/>
  </g>
  <path d="M3 0 L3 26 M11 0 L11 26" fill="none" stroke-width="1.2"/>
</svg>
