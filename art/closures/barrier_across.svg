<!-- One panel of a road closure barrier, seen face on. Repeated across the mouth of a
     north-south street. Amber and white on purpose: a closure is civil, and must not read
     as the grey military barricade an event leaves behind — and it is two rails on posts
     rather than the roadworks event's single red board, so a closed street and a patch of
     roadworks are kin without being the same picture.
     `City._spawn_barrier` lays these edge to edge across the street, each stretched to its share
     of the width, so it tiles: both rails run the full width with no end line, their stripes
     repeat every 11px so the neighbour's continue on the same phase, and each panel stands on
     one post at its middle, so the posts fall evenly along the line. Feet-anchored at the bottom centre. -->
<svg xmlns="http://www.w3.org/2000/svg" width="22" height="24" viewBox="0 0 22 24" shape-rendering="geometricPrecision" stroke="#2a2226" stroke-width="1" stroke-linejoin="round" stroke-linecap="round">
  <defs>
    <clipPath id="closure-across-rails">
      <path d="M0 3 L22 3 L22 8.6 L0 8.6 Z M0 11.4 L22 11.4 L22 16.6 L0 16.6 Z"/>
    </clipPath>
  </defs>
  <!-- One post behind the rails, at the panel's middle, on a foot. -->
  <path d="M11 1.6 L11 22.4" fill="none" stroke="#2a2226" stroke-width="3"/>
  <path d="M11 2.1 L11 22.2" fill="none" stroke="#8a8378" stroke-width="1.4"/>
  <path d="M7.6 23 L14.4 23" fill="none" stroke="#2a2226" stroke-width="1.8"/>
  <!-- The rails: white, amber stripes, each lit along its top and shaded along its foot. -->
  <path d="M0 3 L22 3 L22 8.6 L0 8.6 Z M0 11.4 L22 11.4 L22 16.6 L0 16.6 Z" fill="#ece6d6" stroke="none"/>
  <g clip-path="url(#closure-across-rails)" stroke="none">
    <path d="M-11 3 L-5.5 3 L1.5 17 L-4 17 Z M0 3 L5.5 3 L12.5 17 L7 17 Z M11 3 L16.5 3 L23.5 17 L18 17 Z M22 3 L27.5 3 L34.5 17 L29 17 Z" fill="#e0862a"/>
    <path d="M0 7 L22 7 L22 8.6 L0 8.6 Z M0 15 L22 15 L22 16.6 L0 16.6 Z" fill="#3b2410" fill-opacity="0.26"/>
    <path d="M0 4.1 L22 4.1 M0 12.4 L22 12.4" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="0.8"/>
  </g>
  <path d="M0 3 L22 3 M0 8.6 L22 8.6 M0 11.4 L22 11.4 M0 16.6 L22 16.6" fill="none" stroke-width="1.1"/>
</svg>
