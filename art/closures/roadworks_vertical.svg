<!-- The roadworks of `roadworks.svg` across an east-west street: the trench is cut north to south,
     away from the camera, so the same dig is drawn again in the game's own projection rather than
     turned. The trench runs down the screen with its far end wall of earth lit and a ladder
     standing in it, leaning out over that far rim; the spoil heap with the shovel in it stands
     beside its far half, a length of concrete pipe lies beside its near half with its hollow mouth
     turned to us, and a traffic cone stands at the near corner. Feet-anchored at the bottom
     centre; the dig lies along the bottom 64px of the canvas, the same length of road
     `roadworks.svg` spans across a north-south street, and `ClosureMarker` stands it half that
     below the street's middle so it is centred there, with its own ground shadow under it; none is
     drawn here. -->
