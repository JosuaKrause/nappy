<!-- The stanchion the police cordon's tape is strung on (`ParkCordon`): a slim dark pole on a
     weighted round base, with the tape's reel housing at hip height in the tape's own police blue
     and white, and a pale cap. Slim, so a line of them reads as a temporary cordon rather than
     the square park fence post. Upright on both axes, so the same picture stands where a
     broadside stretch ends and where an end-on one does. A soft contact shadow sits under the
     base, as under `park_post.svg`. Feet-anchored at the bottom centre, (6,22); the housing
     spans 13 to 18px above the feet, where the tape is carried. -->
<svg xmlns="http://www.w3.org/2000/svg" width="12" height="22" viewBox="-2 0 12 22" shape-rendering="geometricPrecision" stroke="#22304f" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round">
  <!-- Its contact shadow, wider than the base it sits under. -->
  <ellipse cx="4" cy="21" rx="5.8" ry="1" fill="#211d1c" fill-opacity="0.25" stroke="none"/>
  <!-- The weighted base, a flat disc on the ground. -->
  <ellipse cx="4" cy="20.6" rx="3.8" ry="1.3" fill="#2a2d36"/>
  <!-- The pole, lit down its left. -->
  <path d="M3.1 2.6 L4.9 2.6 L4.9 20.4 L3.1 20.4 Z" fill="#454e5c"/>
  <path d="M3.4 3 L3.4 20" fill="none" stroke="#9aa3b2" stroke-width="0.5"/>
  <!-- The reel housing the tape comes out of. -->
  <path d="M2 4 L6 4 L6 9 L2 9 Z" fill="#e8ecf0"/>
  <path d="M2 5.4 L6 5.4 L6 7.4 L2 7.4 Z" fill="#31497a" stroke="none"/>
  <path d="M2 4 L6 4 L6 9 L2 9 Z" fill="none"/>
  <!-- The cap. -->
  <path d="M2.6 1 L5.4 1 L5.4 2.8 L2.6 2.8 Z" fill="#d8dde4"/>
</svg>
