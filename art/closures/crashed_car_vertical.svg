<!-- The two cars of `crashed_car.svg` met head on across an east-west street: they lie north to
     south, nose to nose and slewed a little off the line, so each is drawn in the crowd cars' own
     end view rather than as a turned profile. The blue one is the far car, facing the camera, its hood buckled and a bumper hanging
     off its crushed front; the red one is nearer, facing away, its hood sprung up over the place
     they met. Steam from the wreck, glass, a bumper and a hubcap on the road. Feet-anchored at the
     bottom centre; the wreck lies along the bottom 80px of the canvas, the same length of road
     `crashed_car.svg` spans across a north-south street, and `ClosureMarker` stands it half that
     below the street's middle so it is centred there, with its own ground shadow under it; none is
     drawn here. -->
