<!-- The ceiling down across the top floor's hallway: two tiles of corridor filled wall to wall
     with slab, plaster and a snapped joist. Registration is the top-left of the two-by-two cell
     patch it fills, so the picture covers exactly the ground the plan marks unwalkable — the
     hallway is two tiles deep, and a heap that stopped short of either row would read as
     something to squeeze past. Palette is the hallway's own plaster and floor with the masonry
     greys the closure rubble uses; the shards are irregular and the bent rebar is what tells a
     fallen ceiling from a stack of crates. -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" shape-rendering="geometricPrecision" stroke="#3b3034" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round">
  <!-- Dust settled on the floor along both open edges, so the heap sits on the ground. -->
  <path d="M0 57H64V64H0Z" fill="#221f28" fill-opacity="0.22" stroke="none"/>
  <path d="M0 1H64V7H0Z" fill="#221f28" fill-opacity="0.16" stroke="none"/>

  <!-- Bent rebar out of the break, drawn under the mass so only the ends show. -->
  <path d="M12 6C6 11 7 17 13 20 M52 4C58 9 56 15 50 18 M31 57C26 60 21 59 19 55" fill="none" stroke="#4a423b" stroke-width="1.4"/>

  <!-- The mass, wall to wall: no floor is visible between the two slabs. -->
  <path d="M0 11L10 3L21 8L33 2L44 8L55 3L64 10V52L53 60L41 55L30 61L18 55L7 60L0 51Z" fill="#6b6357"/>
  <path d="M4 19L15 13L25 18L36 13L47 18L59 14L60 45L49 51L38 46L27 52L16 46L5 50Z" fill="#847a6b"/>

  <!-- Broken concrete faces, each a different irregular shard catching the north light. -->
  <path d="M7 21L19 15L27 19L23 30L11 31Z" fill="#9a8f7e"/>
  <path d="M33 16L46 14L53 22L45 29L34 26Z" fill="#9a8f7e"/>
  <path d="M13 37L26 34L33 40L24 47L15 44Z" fill="#5c564d"/>
  <path d="M38 33L52 30L57 38L47 45L39 41Z" fill="#4e4a44"/>
  <!-- Cracks across the faces: the one thing that separates broken stone from cut stone. -->
  <path d="M11 20L18 26L14 31 M36 18L41 24L49 23 M18 36L22 42L30 41 M42 32L45 39L54 37" fill="none" stroke="#5c564d" stroke-width="0.7"/>

  <!-- Snapped ceiling joist through the pile: the one straight edge in a heap of broken ones. -->
  <path d="M5 30L45 42L42 48L2 36Z" fill="#7f6859"/>
  <path d="M7 32L43 43" fill="none" stroke="#5d4948" stroke-width="0.9"/>
  <path d="M45 42L54 38L56 44L42 48Z" fill="#5d4948"/>

  <!-- Plaster torn off this corridor's own wall, in the hallway's own colour. -->
  <path d="M19 7L31 10L27 17L16 14Z" fill="#b5a28c"/>
  <path d="M45 46L58 44L56 52L44 53Z" fill="#b5a28c"/>
  <path d="M2 43L11 41L14 49L3 51Z" fill="#a18f7c"/>

  <!-- Loose chunks spilling onto the floor at the open edges. -->
  <path d="M22 53L31 51L34 57L24 59Z" fill="#6b6357"/>
  <path d="M50 54L59 53L61 59L51 60Z" fill="#5c564d"/>
  <path d="M4 5L13 4L15 10L5 11Z" fill="#5c564d"/>
  <circle cx="37" cy="54" r="1.8" fill="#4e4a44"/>
  <circle cx="16" cy="56" r="1.3" fill="#3a3630"/>
  <circle cx="42" cy="8" r="1.5" fill="#4e4a44"/>
</svg>
