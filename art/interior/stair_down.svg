<!-- A down stair occupies one tile: a flat lighter gray crossed by a darker gray line every four
     pixels, the top line on the tile's own top edge. Each line is a tread's edge seen from above,
     the full width of the tile, so a run of these cells reads as one flight and the cells tile
     into each other with no seam. Nothing narrows and nothing points: the even lines are the
     whole of what says stair (2026-09-19, the player: "a full gray texture with dark gray lines
     every x pixels"). -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect width="32" height="32" fill="#8b8e93"/>
  <path d="M0 0.5H32 M0 4.5H32 M0 8.5H32 M0 12.5H32 M0 16.5H32 M0 20.5H32 M0 24.5H32 M0 28.5H32" stroke="#4a4d52" stroke-width="1"/>
</svg>
