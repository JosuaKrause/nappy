<!-- Open passage indent. 28x16, bottom-centre anchored at the hallway's south edge. A shallow
     notch cut into the skirting and wall, floor colour visible at its back, and nothing else —
     no frame, no door-shaped opening. The locked apartment recess (apartment_threshold.svg) is
     the same notch with a brown bar across its mouth. -->
<svg xmlns="http://www.w3.org/2000/svg" width="28" height="16" viewBox="0 0 28 16" shape-rendering="crispEdges">
  <rect x="4" width="20" height="16" fill="#302a31"/>
  <rect x="4" width="2" height="16" fill="#4d4140"/>
  <rect x="22" width="2" height="16" fill="#4d4140"/>
  <rect x="6" y="6" width="16" height="10" fill="#77716d"/>
  <path d="M6 6H22" stroke="#5f5555" stroke-width="1"/>
</svg>
