<!-- Use the zebra: a street from above with a zebra crossing over it, the pram on its
     stripes. hint_arrow.svg beside it points at the nearest one.
     A thought-bubble icon: 24x20, centre anchor (12,10), drawn into the bubble's icon box
     (thought_bubble.svg). -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="20" viewBox="0 0 24 20" shape-rendering="geometricPrecision" stroke="#221f28" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round">
  <rect x="0.5" y="0.5" width="23" height="4" fill="#a59d8e"/>
  <rect x="0.5" y="4.5" width="23" height="11" fill="#46464f"/>
  <rect x="0.5" y="15.5" width="23" height="4" fill="#a59d8e"/>
  <g fill="#ece6d6" stroke="none">
    <rect x="5" y="5.6" width="14" height="1.9"/>
    <rect x="5" y="9.05" width="14" height="1.9"/>
    <rect x="5" y="12.5" width="14" height="1.9"/>
  </g>
</svg>
