<!-- The run button TouchControls draws beside each joystick focal point: a disc, its rim and two
     chevrons pointing up, a sign for "faster" with no walking direction in it, since the buttons
     sit beside controls whose sideways presses mean walking. Authored the same way pause.svg is, on
     the same 128 grid, with the same three relative opacities (dim disc, mid rim, bright glyph) so
     the one overall alpha TouchControls._draw_run_buttons() multiplies the texture by reads the same
     idle and held contrast the pause button has. The glyph is drawn as strokes, not filled shapes,
     and the two stacked chevrons are centred on the disc as a pair.
     Antialiasing stays on for the reason pause.svg names. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <circle cx="64" cy="64" r="60" fill="#ffffff" fill-opacity="0.16"/>
  <circle cx="64" cy="64" r="60" fill="none" stroke="#ffffff" stroke-width="5" stroke-opacity="0.4"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="12" stroke-linecap="butt" stroke-linejoin="miter">
    <polyline points="36,90 64,62 92,90"/>
    <polyline points="36,64 64,36 92,64"/>
  </g>
</svg>
