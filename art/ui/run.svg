<!-- Run replaces the unused joystick ring. Its disc, rim and two upward chevrons share the
     pause icon's relative opacities. TouchControls scales the outer painted radius (62.5 on
     this 128px grid) to the joystick ring's outer edge, leaving the transparent margin outside
     the visual radius. The chevrons are strokes, centered as a pair. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <circle cx="64" cy="64" r="60" fill="#ffffff" fill-opacity="0.16"/>
  <circle cx="64" cy="64" r="60" fill="none" stroke="#ffffff" stroke-width="5" stroke-opacity="0.4"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="12" stroke-linecap="butt" stroke-linejoin="miter">
    <polyline points="36,90 64,62 92,90"/>
    <polyline points="36,64 64,36 92,64"/>
  </g>
</svg>
