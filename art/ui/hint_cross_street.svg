<!-- Cross the street: a street from above, the near (left) sidewalk shut by a barrier and a
     crosswalk further up, drawn as the crosswalk icon draws it, where the way over is.
     hint_arrow.svg beside it points at the nearest crosswalk.
     A thought-bubble icon: 24x20, centre anchor (12,10), drawn into the bubble's icon box
     (thought_bubble.svg). -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="20" viewBox="0 0 24 20" shape-rendering="geometricPrecision" stroke="#221f28" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round">
  <rect x="0.5" y="0.5" width="6.5" height="19" fill="#a59d8e"/>
  <rect x="7" y="0.5" width="10" height="19" fill="#46464f"/>
  <rect x="17" y="0.5" width="6.5" height="19" fill="#a59d8e"/>
  <g fill="#cfc7ae" stroke="none">
    <rect x="8.3" y="1.5" width="2.6" height="5.5"/>
    <rect x="13.1" y="1.5" width="2.6" height="5.5"/>
  </g>
  <rect x="0.5" y="11.2" width="6.5" height="2.8" fill="#f1ede2"/>
  <path d="M2.1 11.2 L0.5 12.8 M5.1 11.2 L2.5 13.8 M7 12.3 L5.3 14" stroke="#e8822e" stroke-width="1.5"/>
  <rect x="0.5" y="11.2" width="6.5" height="2.8" fill="none"/>
