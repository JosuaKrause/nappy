<!-- The way a hint points, inside the thought bubble: drawn pointing east and turned at runtime
     toward the way to go, which is layout, not a picture. Centre anchor (7,7), the point it turns
     about. The blue every arrow in the hints shares, so blue in a bubble always means where to
     walk; it is neither the caret's amber nor the home arrow's pale blue. -->
<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 14 14" shape-rendering="geometricPrecision">
  <polygon points="1.5,5.2 6.6,5.2 6.6,1.8 12.6,7 6.6,12.2 6.6,8.8 1.5,8.8" fill="#3d78b8" stroke="#221f28" stroke-width="1.2" stroke-linejoin="round"/>
</svg>
