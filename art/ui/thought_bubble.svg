<!-- The thought bubble's frame: a hint over her head, never a warning. A cloud on two trailing
     dots, paper-white in the vocabulary's near-black outline, so neither its shape nor its colour
     is the amber or red bar of the exclamation mark (alert.svg) and it reads over pavement, grass
     and asphalt alike. The outline is the union of the cloud's circles: each is drawn once fat in
     the outline colour and once in the fill on top, so no seam shows inside.
     Registration: bottom centre (28,46), the lower dot's foot, which stands over her head. The
     icon box is the cloud's middle: an icon (24x20) is centred on (28,17.5) when the hint points
     nowhere, and on (21,17.5) beside hint_arrow.svg centred on (41,17.5) when it points. -->
<svg xmlns="http://www.w3.org/2000/svg" width="56" height="46" viewBox="0 0 56 46" shape-rendering="geometricPrecision">
  <g fill="#221f28" stroke="#221f28" stroke-width="4">
    <ellipse cx="28" cy="18" rx="20" ry="11"/>
    <circle cx="12" cy="18" r="8"/>
    <circle cx="44" cy="18" r="8"/>
    <circle cx="19" cy="11" r="7"/>
    <circle cx="30" cy="10" r="6.5"/>
    <circle cx="40.5" cy="11" r="6"/>
    <circle cx="18" cy="25" r="6"/>
    <circle cx="30" cy="26" r="5.5"/>
    <circle cx="41" cy="25" r="6"/>
    <circle cx="25" cy="37.5" r="3"/>
    <circle cx="21" cy="42.5" r="1.6"/>
  </g>
  <g fill="#f7f3e8">
    <ellipse cx="28" cy="18" rx="20" ry="11"/>
    <circle cx="12" cy="18" r="8"/>
    <circle cx="44" cy="18" r="8"/>
    <circle cx="19" cy="11" r="7"/>
    <circle cx="30" cy="10" r="6.5"/>
    <circle cx="40.5" cy="11" r="6"/>
    <circle cx="18" cy="25" r="6"/>
    <circle cx="30" cy="26" r="5.5"/>
    <circle cx="41" cy="25" r="6"/>
    <circle cx="25" cy="37.5" r="3"/>
    <circle cx="21" cy="42.5" r="1.6"/>
  </g>
</svg>
