<!-- The pause disc, rim and bars are baked into one asset. TouchControls compensates for
     the transparent border when sizing its visible radius: the outer rim reaches 62.5px
     from the center on this 128px grid. Relative opacities keep disc, rim and bars distinct;
     the runtime alpha supplies idle/held contrast. Antialiasing keeps the small disc smooth. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <circle cx="64" cy="64" r="60" fill="#ffffff" fill-opacity="0.16"/>
  <circle cx="64" cy="64" r="60" fill="none" stroke="#ffffff" stroke-width="5" stroke-opacity="0.4"/>
  <rect x="43" y="38.5" width="14" height="51" fill="#ffffff" fill-opacity="0.8"/>
  <rect x="71" y="38.5" width="14" height="51" fill="#ffffff" fill-opacity="0.8"/>
</svg>
