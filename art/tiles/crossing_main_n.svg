<!-- A signalled crossing on the main road, north edge. Two dotted lines demark the safe zone
     instead of a zebra: a zebra means the traffic gives way to you and the spine's traffic obeys
     the light, so the paint has to say "stand between these" rather than "step out". This tile
     carries the line on its own outer edge; crossing_main_s carries the other one. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect x="0" y="0" width="32" height="32" fill="#3b3b45"/>
  <rect x="21" y="19" width="4" height="1" fill="#43434e"/>
  <rect x="1" y="2" width="6" height="3" fill="#b9b087"/>
  <rect x="13" y="2" width="6" height="3" fill="#b9b087"/>
  <rect x="25" y="2" width="6" height="3" fill="#b9b087"/>
</svg>
