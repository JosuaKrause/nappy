<!-- The sea wall the southern shore ends at: one course of stone standing in the water, with its
     shadow on the water at its foot. It is the tile that says *the city stops here* on the one side
     where the ground does not simply carry on, so it is drawn as a built edge rather than as a
     beach. Below the stone the tile is transparent: the south water is drawn beneath the whole
     bulkhead row and shows through, so the shore meets the water with no second water picture. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect x="0" y="0" width="32" height="22" fill="#8a8378"/>
  <rect x="0" y="0" width="32" height="2" fill="#9c9488"/>
  <rect x="0" y="20" width="32" height="2" fill="#6d675e"/>
  <rect x="10" y="2" width="1" height="18" fill="#7b756b"/>
  <rect x="22" y="2" width="1" height="18" fill="#7b756b"/>
  <rect x="0" y="22" width="32" height="1" fill="#000000" fill-opacity="0.4"/>
</svg>
