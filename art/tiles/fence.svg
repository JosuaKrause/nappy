<!-- The east/west boundary fence, seen from directly above. The rail is a thin
     north-south line; clipped post heads at both tile edges repeat seamlessly. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="geometricPrecision" stroke="#3b2d32" stroke-width="0.8" stroke-linejoin="round">
  <rect x="0" y="0" width="32" height="32" fill="#6d9159" stroke="none"/>
  <rect x="16" y="0" width="16" height="32" fill="#5f8250" stroke="none"/>
  <rect x="17.5" y="0" width="2" height="32" fill="#3b2d32" fill-opacity="0.18" stroke="none"/>
  <rect x="15.25" y="0" width="1.5" height="32" rx="0.75" fill="#6f6248"/>
  <g fill="#8a7a5c">
    <circle cx="16" cy="0" r="2.4"/>
    <circle cx="16" cy="16" r="2.4"/>
    <circle cx="16" cy="32" r="2.4"/>
  </g>
  <g fill="#b0a080" stroke="none">
    <circle cx="15.25" cy="0" r="0.65"/>
    <circle cx="15.25" cy="15.25" r="0.65"/>
    <circle cx="15.25" cy="31.25" r="0.65"/>
  </g>
</svg>
