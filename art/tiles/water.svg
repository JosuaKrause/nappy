<!-- Open water past the bulkhead. Flat and cold, with a few slack ripples: it is scenery the
     player can never reach, so it must read at a glance and never ask to be looked at twice. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect x="0" y="0" width="32" height="32" fill="#3a5a72"/>
  <rect x="4" y="7" width="6" height="1" fill="#456781"/>
  <rect x="19" y="4" width="5" height="1" fill="#456781"/>
  <rect x="12" y="16" width="7" height="1" fill="#456781"/>
  <rect x="24" y="21" width="5" height="1" fill="#456781"/>
  <rect x="2" y="26" width="6" height="1" fill="#335066"/>
  <rect x="17" y="29" width="5" height="1" fill="#335066"/>
</svg>
