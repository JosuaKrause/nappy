<!-- What calm ground becomes when it is taken or burnt: churned, colourless, tracked over.
     The same ground the player walked on last week, and no longer worth walking to. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect x="0" y="0" width="32" height="32" fill="#6b6357"/>
  <rect x="0" y="9" width="32" height="2" fill="#5d564c"/>
  <rect x="0" y="21" width="32" height="2" fill="#5d564c"/>
  <rect x="5" y="3" width="4" height="1" fill="#786f61"/>
  <rect x="22" y="15" width="5" height="1" fill="#786f61"/>
  <rect x="13" y="27" width="4" height="1" fill="#5d564c"/>
</svg>
