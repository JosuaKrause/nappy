<!-- Basement steam, second frame: the plume billowing. The cloud from `steam.svg` has lifted
     and spread, and a fresh puff is pushing out of the mouth of `steam_pipe.svg` under it. Same
     32x48 canvas and bottom-centre anchor as `steam.svg` and the pipe, so alternating the two
     frames moves nothing but the steam. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="48" viewBox="0 0 32 48" shape-rendering="geometricPrecision" stroke="#3b3034" stroke-linejoin="round" stroke-linecap="round">
  <!-- Ground anchor is the canvas bottom centre, the foot of the pipe the cloud rises from. -->
  <!-- The lifted cloud, thinner than the fresh puff below it. -->
  <path d="M6 18C2 17 2 11 7 11C6 6 11 3 15 6C16 2 23 2 24 6C29 5 31 11 28 14C31 17 27 21 23 19C21 22 16 22 14 19C11 21 7 21 6 18Z" fill="#d5d7cf" fill-opacity="0.6" stroke="#777d7e" stroke-width="1"/>
  <path d="M9 13C12 15 15 12 18 14M20 9C22 8 24 9 25 10" fill="none" stroke="#f0eee3" stroke-width="1" stroke-linecap="round"/>
  <!-- The fresh puff out of the mouth. -->
  <path d="M13 28C10 27 10 23 13 23C12 20 16 18 18 20C20 18 24 20 23 23C26 24 25 28 22 28C20 30 15 30 13 28Z" fill="#d5d7cf" fill-opacity="0.82" stroke="#777d7e" stroke-width="1"/>
  <path d="M14 25C16 26 18 24 20 25" fill="none" stroke="#f0eee3" stroke-width="1" stroke-linecap="round"/>
</svg>
