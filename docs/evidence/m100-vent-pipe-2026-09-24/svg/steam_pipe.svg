<!-- Basement steam vent: the pipe alone, standing whether it blows or not. Same 32x48 canvas and
     bottom-centre anchor as `steam.svg` and `steam_b.svg`, which draw only the cloud, so the
     cloud stands over this mouth with no offset of its own. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="48" viewBox="0 0 32 48" shape-rendering="geometricPrecision" stroke="#3b3034" stroke-linejoin="round" stroke-linecap="round">
  <!-- Ground anchor is the canvas bottom centre. -->
  <path d="M3 45H29L27 48H5Z" fill="#221f28" fill-opacity="0.24" stroke="none"/>
  <!-- The housing on the floor, and the riser standing out of its top. -->
  <path d="M5 44V33H20V44Z" fill="#555c60" stroke-width="1"/>
  <path d="M6 34H19" fill="none" stroke="#6a7174" stroke-width="1"/>
  <path d="M14 33V28H20V33Z" fill="#6a7174" stroke-width="1"/>
  <path d="M15.5 32V29" fill="none" stroke="#9a9d98" stroke-width="1"/>
  <!-- The collar and the open mouth the steam comes out of. -->
  <path d="M13 28V26H21V28Z" fill="#7a8083" stroke-width="1"/>
  <ellipse cx="17" cy="26" rx="3" ry="1.2" fill="#1b181e" stroke-width="0.8"/>
</svg>
