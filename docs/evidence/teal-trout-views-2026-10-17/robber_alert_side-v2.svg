<!-- A proposal, not game art: the second attempt at art/events/robber_alert_side.svg, drawn
     beside it for the player to choose between and referenced by nothing in the game. Where v1
     keeps the waiting silhouette and adds one small hand at the hip, this one changes the
     outline: the stance is wide, the back foot planted behind him and the front foot ahead,
     the near arm is held off the body, back and low, with its open hand behind his hip, and
     the far arm hangs forward of his chest with its hand showing past his front, so both
     hands are out of the coat on either side of him as they are in robber_alert_front.svg.
     Still a man who has seen her and not yet a reach: robber_lunging_side.svg's arm is thrown
     out at shoulder height. Faces east; mirrored for a westward heading. Canvas 26x44, ground
     anchor bottom centre (13,44), v1's canvas; the body stands 2px right of
     robber_waiting_side.svg's on its 22-wide canvas, so the two register at the swap. -->
