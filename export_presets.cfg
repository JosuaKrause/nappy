; Tracked deliberately, unlike most export_presets.cfg files: see the comment beside the
; ignore rule in .gitignore. A Web preset carries no credentials, only a build recipe, and a
; recipe untracked is a build nobody but this machine can reproduce.

[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
; The two JSON files the running game reads with FileAccess rather than load(), named here so
; the export cannot lose either: assets/atlases/baked/regions.json says where every baked
; picture sits on its page -- AtlasLibrary answers nothing without it -- and
; assets/ground_layers.json is the ground compositor's own component list.
include_filter="assets/ground_layers.json,assets/atlases/baked/regions.json"
; Build metadata, tests and development scene recipes, not game data. membership.json says which page a picture belongs on
; and bake_manifest.json holds a SHA-256 per input; both are read by tools/bake-atlases.sh and by
; the test suite, neither by the game. Tests and probes remain imported for local development and
; CI but nothing under tests/ belongs in the player's download. Scene recipes remain plain files
; for local development tools, with scene-recipes/.gdignore keeping them out of resource import.
; tools/audit-pck.sh checks the
; resulting pack itself, including remaps and literal resource references retained in the
; global class cache or another packed file.
exclude_filter="assets/atlases/membership.json,assets/atlases/baked/bake_manifest.json,tests/*,scene-recipes/*"
export_path="build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release="build/web-template/template.zip"
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
; Godot's own shell is kept: this only adds markup to its <head>, rather than replacing the
; page and taking on the job of tracking every future Godot shell change by hand.
;
; No orientation lock and no rotate-your-phone message: the device's own orientation is left
; exactly as the player set it, whatever that is, and a portrait phone with auto-rotate off is
; never told to do anything about it. The game presents itself rotated instead, in the engine —
; see src/ui/screen_orientation.gd — so a portrait touch viewport gets a full-size landscape
; game rather than a thin letterboxed strip of one, and nothing here has to know the shape of
; the viewport it is opened in.
;
; The <title>, the description and the Open Graph/Twitter tags below are what a browser tab, a
; search result and a pasted link read — Godot's own shell carries none of them, but it does
; write its own <title>Nappy</title> before this is appended; tools/export-web.sh strips that
; one out of the exported index.html so the page ends up with exactly the one below rather than
; two (docs/playtests/PLAYTEST-27.md finding 5). og:image and twitter:image point at social-card.png,
; published beside index.html by the deploy workflow from art/social-card.png — a copy of
; the art/logo.png wordmark flattened onto an opaque background, since logo.png is RGBA with
; transparent pixels carrying RGB (0,0,0), and a link-unfurler that ignores alpha paints those
; black rather than showing nothing. art/logo.png itself is untouched, since it is also the
; README's image and transparency is right for that use. Neither is in the export: art/ carries
; a .gdignore, which is why the workflow copies the card beside the page rather than serving it
; out of the pack. og:image:type/width/height are
; declared because several unfurlers skip an image they would otherwise have to fetch and
; measure themselves, and the same is true of a page that never sets twitter:image at all,
; which left every Twitter-family client falling back to whatever og:image handling it has.
; Every attribute here is single-quoted on purpose: this whole value is one double-quoted .cfg
; string, and a double quote in the markup would end it early.
; The head also counts with GoatCounter, which sets no cookie and keeps nothing about a
; visitor, on one site: count.js loads with nappy.goatcounter.com as its endpoint and counts
; the page load itself, once the tab is visible, under the path the path function gives it,
; the page's host and path (nappy.josuakrause.com/), with that site's sessions, so a visit is a
; visitor. The path function applies only to that page load: every game event (VisitCounter)
; names its own path and opts out of sessions with no_session, so it counts every time.
; count.js skips localhost, private networks, file:, a frame, a prerendered page and a browser
; carrying skipgc on its own, and flags a WebDriver browser as a bot, which GoatCounter does
; not count. See docs/TELEMETRY.md, "The page counts visits", for everything a hit carries.
; A page carrying ?debug=1 loads none of it, so nothing on it is counted. The markup carries
; no backslash either, since the .cfg string would read it as an escape.
html/head_include="<title>Nappy — walk a baby through a city until she sleeps</title><meta name='description' content='A route-planning game about walking a baby through a city: choose the streets, keep her calm, and carry her home.'><meta property='og:title' content='Nappy — walk a baby through a city until she sleeps'><meta property='og:description' content='A route-planning game about walking a baby through a city: choose the streets, keep her calm, and carry her home.'><meta property='og:image' content='https://nappy.josuakrause.com/social-card.png'><meta property='og:image:type' content='image/png'><meta property='og:image:width' content='1280'><meta property='og:image:height' content='640'><meta property='og:url' content='https://nappy.josuakrause.com/'><meta property='og:type' content='website'><meta name='twitter:card' content='summary_large_image'><meta name='twitter:image' content='https://nappy.josuakrause.com/social-card.png'><meta name='twitter:title' content='Nappy — walk a baby through a city until she sleeps'><script>if (!/[?&]debug=1(&|$)/.test(location.search)) { window.goatcounter = {path: function () { return location.host + location.pathname }}; var counter = document.createElement('script'); counter.async = true; counter.dataset.goatcounter = 'https://nappy.goatcounter.com/count'; counter.src = 'https://gc.zgo.at/count.js'; document.head.appendChild(counter) }</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/offline_page=""
progressive_web_app/display=1
; Godot's Web export writes this into the PWA manifest as "landscape" (index 1 of
; Any/Landscape/Portrait), read only from an installed home-screen PWA rather than the ordinary
; browser tab this page is opened as. Left declared for the day the full PWA export is turned
; on; until then nothing reads a manifest that is never written, and the ordinary tab gets its
; landscape presentation from the engine itself — see src/ui/screen_orientation.gd.
progressive_web_app/orientation=1
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0, 0, 0, 1)
