; Tracked deliberately, unlike most export_presets.cfg files: see the comment beside the
; ignore rule in .gitignore. A Web preset carries no credentials, only a build recipe, and a
; recipe untracked is a build nobody but this machine can reproduce.

[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
; Godot's own shell is kept: this only adds markup to its <head>, rather than replacing the
; page and taking on the job of tracking every future Godot shell change by hand.
;
; Two things a phone needs that the PWA orientation key below cannot give it, because that key
; is only read from an installed home-screen PWA and this page is opened as an ordinary browser
; tab: an attempt at screen.orientation.lock(), which is the only real orientation lock there
; is and needs fullscreen on Chrome for Android and does not exist on iOS Safari at all, so the
; call is wrapped in both a try/catch and a .catch() — the spec routes a lock failure through
; the promise, but a missing API or an implementation that throws synchronously instead must be
; just as silent; and, since that lock cannot be relied on, a CSS overlay that asks instead of
; forcing. The overlay keys on "hover: none" and "pointer: coarse" together with "orientation:
; portrait", which is true for a touchscreen held upright and false for a desktop window that
; merely happens to be taller than it is wide, so a narrow desktop window is never told to
; rotate.
;
; The <title>, the description and the Open Graph/Twitter tags after the rotate overlay are what
; a browser tab, a search result and a pasted link read — Godot's own shell carries none of them.
; og:image is the wordmark at assets/logo.png (same face the README's play link already uses,
; so the card and the repo show one image rather than two), published as social-card.png beside
; index.html by the deploy workflow, since the Web export packs project assets into the .pck
; rather than serving them as loose files — an og:image the export never publishes is a blank
; card regardless of what the URL says. Every attribute here is single-quoted on purpose: this
; whole value is one double-quoted .cfg string, and a double quote in the markup would end it
; early.
html/head_include="<style>#nappy-rotate-overlay{display:none;position:fixed;inset:0;z-index:9999;background:#000;color:#fff;font:16px/1.4 sans-serif;align-items:center;justify-content:center;text-align:center;padding:2em;}@media (orientation: portrait) and (hover: none) and (pointer: coarse){#nappy-rotate-overlay{display:flex;}}</style><script>window.addEventListener('DOMContentLoaded',function(){var o=document.createElement('div');o.id='nappy-rotate-overlay';o.textContent='Turn your phone sideways to play.';document.body.appendChild(o);if(screen.orientation&&typeof screen.orientation.lock==='function'){try{screen.orientation.lock('landscape').catch(function(){});}catch(e){}}});</script><title>Nappy — walk a baby through a city until she sleeps</title><meta name='description' content='A route-planning game about walking a baby through a city: choose the streets, keep her calm, and carry her home.'><meta property='og:title' content='Nappy — walk a baby through a city until she sleeps'><meta property='og:description' content='A route-planning game about walking a baby through a city: choose the streets, keep her calm, and carry her home.'><meta property='og:image' content='https://nappy.josuakrause.com/social-card.png'><meta property='og:url' content='https://nappy.josuakrause.com/'><meta property='og:type' content='website'><meta name='twitter:card' content='summary_large_image'>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/offline_page=""
progressive_web_app/display=1
; Godot's Web export writes this into the PWA manifest as "landscape" (index 1 of
; Any/Landscape/Portrait): letterboxed to 16:9, a portrait phone would show a strip of the
; city with nothing playable on either side of it. Left declared for the day the full PWA
; export is turned on; until then nothing reads a manifest that is never written, which is why
; html/head_include above carries the working answer for an ordinary browser tab.
progressive_web_app/orientation=1
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0, 0, 0, 1)
