<!-- A shallow tiled cap for one-cell building slivers. It sits inside the facade tile. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"
     shape-rendering="crispEdges">
  <rect x="1" y="1" width="30" height="8" fill="#ffffff" fill-opacity="0.7"/>
  <rect x="0" y="8" width="32" height="2" fill="#221f28" fill-opacity="0.45"/>
  <rect x="4" y="2" width="1" height="6" fill="#ffffff" fill-opacity="0.28"/>
  <rect x="14" y="2" width="1" height="6" fill="#221f28" fill-opacity="0.16"/>
  <rect x="25" y="2" width="1" height="6" fill="#221f28" fill-opacity="0.16"/>
</svg>
