<!-- An unlit window. Not modulated by the building colour: glass is glass whatever the
     wall is painted. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect x="9" y="8" width="14" height="17" fill="#221f28" fill-opacity="0.32"/>
  <rect x="10" y="9" width="12" height="14" fill="#3b3a46"/>
  <rect x="15" y="9" width="1" height="14" fill="#221f28" fill-opacity="0.5"/>
  <rect x="8" y="23" width="16" height="2" fill="#ffffff" fill-opacity="0.22"/>
</svg>
