<!-- A wall sconce, in the wall family: a full 32x32 tile with hallway_wall.svg's own plaster and
     plinth behind it, so it drops into a north-wall column the same way WINDOW and LIFT_DOOR do —
     one texture per column, no runtime overlay to composite. Used on both the hallway's and the
     lobby's north wall. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect width="32" height="32" fill="#b5a28c"/>
  <rect y="26" width="32" height="3" fill="#776459"/>
  <rect y="29" width="32" height="3" fill="#3b3034" fill-opacity="0.58"/>
  <rect x="14" y="10" width="4" height="9" fill="#776459"/>
  <path d="M10 12L22 12L18 8L14 8Z" fill="#79716b"/>
  <circle cx="16" cy="16" r="4" fill="#ffe08a"/>
  <circle cx="16" cy="16" r="6" fill="#f0b34c" fill-opacity="0.35"/>
</svg>
