<!-- Locked apartment indent. 28x16, bottom-centre anchored at the hallway's south edge. The same
     shallow notch as the open passage indent (open_threshold.svg), with a brown bar across its
     mouth — the bar alone is what says closed; no frame, chain or door-shaped opening. -->
<svg xmlns="http://www.w3.org/2000/svg" width="28" height="16" viewBox="0 0 28 16" shape-rendering="crispEdges">
  <rect x="4" width="20" height="16" fill="#302a31"/>
  <rect x="4" width="2" height="16" fill="#4d4140"/>
  <rect x="22" width="2" height="16" fill="#4d4140"/>
  <rect x="6" y="6" width="16" height="10" fill="#77716d"/>
  <path d="M6 6H22" stroke="#5f5555" stroke-width="1"/>
  <rect x="4" y="5" width="20" height="4" fill="#6b4a34"/>
  <path d="M4 5H24" stroke="#8a6242" stroke-width="1"/>
  <path d="M4 9H24" stroke="#3f2a1c" stroke-width="1"/>
</svg>
