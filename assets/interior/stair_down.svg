<!-- Side-on switchback module: two lateral flights joined by a right-hand landing.
     Canvas 64x64; registration (32,64). Upper/lower landing centres (8,10)/(8,58),
     intermediate landing (56,34). Mirror horizontally for the opposite stairwell.
     The picture spans a 2x2-tile projection, not a floor-transition trigger. -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" stroke="#3b3034" stroke-linejoin="round" stroke-linecap="round">
  <!-- Short, constant-depth landing planes; the shaft between flights stays open. -->
  <path d="M2 10H14V14H2Z M48 34H62V38H48Z M2 58H14V62H2Z" fill="#62656a" stroke-width="1"/>
  <path d="M2 10L5 7H17L14 10Z M48 34L51 31H62V34Z M2 58L5 55H17L14 58Z" fill="#a3a09a" stroke-width="0.8"/>
  <!-- Solid concrete flights have explicit horizontal treads and short vertical risers. -->
  <path d="M14 10H19V13H24V16H29V19H34V22H39V25H44V28H49V31H51V34L48 38L14 14Z" fill="#62656a" stroke-width="1"/>
  <path d="M14 58V55H19V52H24V49H29V46H34V43H39V40H44V37H49V34H51L48 38L14 62Z" fill="#62656a" stroke-width="1"/>
  <path d="M14 10H19 M19 13H24 M24 16H29 M29 19H34 M34 22H39 M39 25H44 M44 28H49 M49 31H52 M14 55H19 M19 52H24 M24 49H29 M29 46H34 M34 43H39 M39 40H44 M44 37H49" fill="none" stroke="#b5aea0" stroke-width="1.4"/>
  <!-- Upright balusters and the two opposite handrail slopes carry the side-on read. -->
  <path d="M3 10V2 M14 10V2 M24 16V8 M34 22V14 M44 28V20 M52 34V26 M61 34V26 M14 58V50 M24 52V44 M34 46V38 M44 40V32 M3 58V50" fill="none" stroke-width="1.3"/>
  <path d="M3 2H14L52 26H61 M3 50H14L52 26" fill="none" stroke-width="2"/>
  <path d="M3 1.5H14L52 25.5H61 M3 49.5H14L52 25.5" fill="none" stroke="#9a897a" stroke-width="0.65"/>
  <path d="M2 63H15 M49 39H61" fill="none" stroke="#221f28" stroke-opacity="0.3" stroke-width="1.5"/>
</svg>
