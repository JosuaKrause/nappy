<!-- Three-tile east-descending stair run for the basement entry. It matches the switchback deck's
     broad tread-and-riser language while covering the existing two physical diagonal cells only.
     Treads are drawn as vertical lines, one per step, clipped to the tread body and thickening
     toward the bottom landing so the flight still reads as descending. -->
<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" shape-rendering="crispEdges" stroke-linejoin="round">
  <defs>
    <clipPath id="tread_short_e">
      <path d="M10 42L42 10H48L86 48V68L68 86H48L10 48Z"/>
    </clipPath>
  </defs>
  <path d="M0 34L34 0H52L96 44V76L76 96H44L0 52Z" fill="#2d3036"/>
  <path d="M4 36L36 4H50L92 46V74L74 92H46L4 50Z" fill="#696c70"/>
  <path d="M10 42L42 10H48L86 48V68L68 86H48L10 48Z" fill="#767a7d"/>
  <g clip-path="url(#tread_short_e)" fill="none">
    <path d="M18 0V96" stroke="#c2b7a5" stroke-width="3"/>
    <path d="M21 0V96" stroke="#41434a" stroke-width="2"/>
    <path d="M32 0V96 M46 0V96" stroke="#c2b7a5" stroke-width="4"/>
    <path d="M35 0V96 M49 0V96" stroke="#41434a" stroke-width="3"/>
    <path d="M60 0V96" stroke="#c2b7a5" stroke-width="5"/>
    <path d="M63 0V96" stroke="#41434a" stroke-width="4"/>
  </g>
  <path d="M4 36L50 82 M36 4L82 50" fill="none" stroke="#a3988a" stroke-width="2"/>
</svg>
