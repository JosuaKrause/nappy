<!-- The sign on the middle panel of a barrier. This is the whole of the legibility promise:
     it faces the junction, so the street is readable as shut from the last place the route
     can still change. -->
<svg xmlns="http://www.w3.org/2000/svg" width="20" height="34" viewBox="0 0 20 34" shape-rendering="crispEdges">
  <rect x="9" y="16" width="2" height="18" fill="#6b6357"/>
  <rect x="1" y="1" width="18" height="18" fill="#221f28"/>
  <rect x="2" y="2" width="16" height="16" fill="#c23b32"/>
  <rect x="4" y="8" width="12" height="4" fill="#e8e2d4"/>
</svg>
