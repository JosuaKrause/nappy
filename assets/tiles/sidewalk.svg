  <rect x="0" y="0" width="32" height="32" fill="#9a907e"/>
  <rect x="0" y="15" width="32" height="1" fill="#7d7669"/>
  <rect x="0" y="31" width="32" height="1" fill="#7d7669"/>
  <rect x="15" y="0" width="1" height="15" fill="#82796b"/>
  <rect x="7" y="16" width="1" height="15" fill="#82796b"/>
  <rect x="23" y="16" width="1" height="15" fill="#82796b"/>
  <rect x="2" y="3" width="8" height="1" fill="#b0a58f" fill-opacity="0.48"/>
  <rect x="19" y="20" width="7" height="1" fill="#b0a58f" fill-opacity="0.4"/>
</svg>
