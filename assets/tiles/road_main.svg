<!-- A main road. Darker, coarser asphalt than an ordinary street, so the spine
     of the city reads as one surface from the first junction to the last. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect x="0" y="0" width="32" height="32" fill="#3b3b45"/>
  <rect x="4" y="6" width="3" height="1" fill="#43434e"/>
  <rect x="21" y="19" width="4" height="1" fill="#43434e"/>
</svg>
