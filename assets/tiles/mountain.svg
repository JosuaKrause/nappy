<!-- The mountainside the city backs onto in the north. Bare rock in bands, so a depth of them
     reads as a slope going up and away rather than as a grey field. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect x="0" y="0" width="32" height="32" fill="#6b6660"/>
  <rect x="0" y="0" width="32" height="3" fill="#7a746d"/>
  <rect x="6" y="8" width="9" height="2" fill="#5d5952"/>
  <rect x="19" y="6" width="7" height="2" fill="#7a746d"/>
  <rect x="2" y="17" width="8" height="2" fill="#7a746d"/>
  <rect x="16" y="20" width="10" height="2" fill="#5d5952"/>
  <rect x="9" y="27" width="7" height="2" fill="#5d5952"/>
  <rect x="22" y="29" width="6" height="2" fill="#7a746d"/>
</svg>
