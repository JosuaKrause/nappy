  <path d="M6 5 Q15 2 24 5 L27 11 L27 37 Q15 42 3 37 L3 11 Z" fill="#ffffff"/>
  <path d="M6 5 Q15 2 24 5 L27 12 L3 12 Z" fill="#f4f4f4"/>
  <path d="M3 34 Q15 38 27 34 L27 38 Q15 43 3 38 Z" fill="#dcdcdc"/>
</svg>
