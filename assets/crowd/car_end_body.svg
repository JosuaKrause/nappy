<!-- A car seen along its length, for the north-south corridors. One sprite serves both
     directions: at this angle the front and the back of a car are the same shape, and the
     lights in the trim are what tell them apart. -->
<svg xmlns="http://www.w3.org/2000/svg" width="30" height="46" viewBox="0 0 30 46" shape-rendering="crispEdges">
  <rect x="3" y="6" width="24" height="34" fill="#ffffff"/>
  <rect x="3" y="6" width="24" height="6" fill="#f4f4f4"/>
  <rect x="3" y="34" width="24" height="6" fill="#dcdcdc"/>
</svg>
