  <rect x="8" y="8" width="10" height="4" fill="#b7a58d"/>
  <rect x="46" y="8" width="10" height="4" fill="#b7a58d"/>
  <rect x="10" y="12" width="6" height="11" fill="#8c7869"/>
  <rect x="48" y="12" width="6" height="11" fill="#8c7869"/>
