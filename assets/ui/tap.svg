  <path d="M48 112 L80 112 L80 76 L72 76 L72 36 L56 36 L56 76 L48 80 L32 84 L32 96 L48 100 Z"
      fill="#ffffff"/>
  <path d="M43.64 23.28 A24 24 0 0 1 84.36 23.28" fill="none" stroke="#ffffff" stroke-width="8"/>
  <path d="M33.48 16.92 A36 36 0 0 1 94.52 16.92" fill="none" stroke="#ffffff" stroke-width="8"/>
</svg>
