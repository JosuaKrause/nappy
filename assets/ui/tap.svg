<!-- The tap mode's own symbol on the title screen: a hand with the index finger raised to
     touch, and two ripple arcs opening above the fingertip — the shape a tap makes rather than a
     hand in motion. This mode aims from wherever she is standing, the way a mouse click always
     has; the glyph names it by the gesture rather than by drawing her, since nothing is drawn for
     this mode at all.
     White line-art on a transparent ground, tinted by ModeButton's own icon_normal_color theme
     override (Palette.BUTTON_SYMBOL) the same way joystick.svg is.
     Authored on a 128 grid with antialiasing left on, because this renders into a 46px-radius
     disc: a small grid with `shape-rendering="crispEdges"` quantises every curve to a staircase
     and flattens the two arcs into bars.
     What makes it read as a hand is the silhouette, not detail at a size that has none to spare:
     a narrow finger with a rounded tip against a much wider palm, a thumb that breaks the
     outline on one side only, and a flat wrist to stand the whole thing on. An earlier version
     drew the same parts with straight lines and square corners, and read as a T with a wedge. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <g fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round">
    <path d="M46 34 A26 26 0 0 1 82 34"/>
    <path d="M33 21 A44 44 0 0 1 95 21"/>
  </g>
  <path fill="#ffffff" d="
      M56 62
      A8 8 0 0 1 72 62
      L72 80
      Q85 80 91 88
      Q96 95 96 105
      L96 112
      Q96 118 90 118
      L59 118
      Q51 118 46 112
      L37 100
      Q33 94 38 90
      Q43 87 47 92
      L56 104
      Z"/>
</svg>
