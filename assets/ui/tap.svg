<!-- The tap scheme's own symbol on the title screen: a pointing hand — palm, the index finger
     extended upward, a folded thumb suggested at the side — with two concentric ripple arcs
     opening above the fingertip, the shape a tap actually makes rather than a moving hand.
     White line-art on a transparent ground, tinted by ModeButton's own icon_normal_color theme
     override (Palette.BUTTON_SYMBOL) the same way joystick.svg is. -->
