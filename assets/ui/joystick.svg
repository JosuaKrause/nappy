<!-- The stick scheme's own symbol on the title screen: an arcade joystick seen slightly from
     above, not a virtual thumbstick — a ball on a shaft rising from a base drawn in perspective.
     White line-art on a transparent ground, tinted by ModeButton's own icon_normal_color theme
     override (Palette.BUTTON_SYMBOL), so the colour lives in one place rather than being baked
     into the art twice.
     The base is the part a flat rectangle could never be: a top face (the rhombus, full white)
     and two side faces below it at reduced opacity. A uniform tint multiplies every pixel by the
     same colour, so the ratio between a fully-opaque face and a dimmer one survives the tint —
     which is what lets three flat shapes still read as one box seen at an angle. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <path d="M64 82 L95 96 L64 110 L33 96 Z" fill="#ffffff"/>
  <path d="M33 96 L64 110 L64 121 L33 107 Z" fill="#ffffff" fill-opacity="0.75"/>
  <path d="M64 110 L95 96 L95 107 L64 121 Z" fill="#ffffff" fill-opacity="0.55"/>
  <rect x="57" y="42" width="14" height="48" rx="3" fill="#ffffff"/>
  <circle cx="64" cy="30" r="19" fill="#ffffff"/>
</svg>
