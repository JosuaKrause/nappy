<!-- The save symbol `SaveIndicator` fades in and back out again after a write — see
     docs/MECHANICS.md, "Saving and resuming". A floppy disk rather than a disc or a checkmark: the
     vocabulary already uses a plain disc for pause and a triangle for continue, and a check would
     read as a completed task rather than as "written to disk", which is the one thing this symbol
     has to say and nothing else in the game says.
     One path, `fill-rule="evenodd"`, cuts two holes from the solid case rather than overlaying
     paler shapes on top of it: the shutter is a notch open to the top edge and the label is a
     window fully inside the lower body, so both are told apart from the case by silhouette rather
     than by opacity and survive being reduced to a single flat runtime tint at the size
     `SaveIndicator` actually shows this at (its `_SIZE`, 48px, shrunk again on a phone) instead of
     merging into one pale square the way three same-shaped fills at three opacities did. The
     chamfered top-right corner is the shape's own write-protect notch, standing in for the whole
     object the way pause.svg's two bars stand in for a pause button — enough silhouette to read as
     a floppy disk at a glance, not a traced photo of one. White on a transparent ground, the same
     as pause.svg/restart.svg/continue.svg, tinted at runtime (`Palette.CHALK_DONE`, the same soft
     confirming green a touched chalk mark turns) rather than baked in, since the modulate that
     tints it is the same one that fades it.
     Authored on the same 128 grid as the rest of this set, with antialiasing left on. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <path fill-rule="evenodd" fill="#ffffff"
      d="M24 24 L92 24 L104 36 L104 104 L24 104 Z
         M40 24 L76 24 L76 48 L40 48 Z
         M36 62 L92 62 L92 92 L36 92 Z"/>
</svg>
