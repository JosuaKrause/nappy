<!-- The one control TouchControls draws itself rather than through a ModeButton: the pause disc,
     its rim and the two bars, all three baked into this one asset rather than three draw() calls.
     Not tinted through a Button's own icon_normal_color — there is no Button here, only
     TouchControls._draw_pause_button()'s draw_texture_rect() — so the held/idle contrast the old
     draw() calls carried in two different alpha values (0.16 resting, 0.32 held, for the disc
     alone) is instead one overall alpha the draw call multiplies the whole texture by, which is
     why the three shapes below already carry their own relative opacities against each other
     (dim disc, mid rim, bright bars) rather than being flat white throughout.
     Authored on the same 128 grid as restart.svg and continue.svg, with antialiasing left on for
     the same reason those two keep it: a small grid with crispEdges would turn the disc's own
     curve into a staircase. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <circle cx="64" cy="64" r="60" fill="#ffffff" fill-opacity="0.16"/>
  <circle cx="64" cy="64" r="60" fill="none" stroke="#ffffff" stroke-width="5" stroke-opacity="0.4"/>
  <rect x="43" y="38.5" width="14" height="51" fill="#ffffff" fill-opacity="0.8"/>
  <rect x="71" y="38.5" width="14" height="51" fill="#ffffff" fill-opacity="0.8"/>
</svg>
