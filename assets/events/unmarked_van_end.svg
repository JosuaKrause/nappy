<!-- The unmarked van seen along its length, for the north-south streets it drives once it hunts —
     a parked van never needed this view, but a pursuer steers straight at her and that is not
     always down a pavement. One sprite serves both directions, the way every other vehicle's
     end-on view does: at this angle the front and the back of a windowless box are the same
     shape. Read against unmarked_van.svg — same paint, same blacked-out cab, and the open door
     reads here as a second dark rectangle low on the body rather than a hole in the side. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="48" viewBox="0 0 32 48" shape-rendering="crispEdges">
  <rect x="3" y="4" width="26" height="32" fill="#4a4e56"/>
  <rect x="3" y="4" width="26" height="3" fill="#5a5f68"/>
  <rect x="8" y="8" width="16" height="6" fill="#191b21"/>
  <rect x="10" y="24" width="12" height="10" fill="#141419"/>
  <rect x="3" y="36" width="26" height="3" fill="#221f28"/>
  <rect x="1" y="10" width="3" height="22" fill="#26232a"/>
  <rect x="28" y="10" width="3" height="22" fill="#26232a"/>
</svg>
