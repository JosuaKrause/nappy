<!-- The post that caps each end of the continuous held-street barrier
     (`roadblock_segment.svg`). Poured-concrete grey with a red hazard cap, the same family as
     `checkpoint_block.svg`'s own palette, so the barrier and the block-shaped badge icon still
     read as kin even though the drawn body no longer shares its picture. -->
<svg xmlns="http://www.w3.org/2000/svg" width="6" height="30" viewBox="0 0 6 30" shape-rendering="geometricPrecision" stroke="#3b2d32" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round">
  <rect x="0" y="0" width="6" height="30" fill="#85857f"/>
  <rect x="0" y="0" width="6" height="6" fill="#c4503c"/>
  <rect x="4" y="6" width="2" height="21" fill="#a5a59d" stroke="none"/>
  <rect x="0" y="27" width="6" height="3" fill="#221f28" stroke="none"/>
</svg>
