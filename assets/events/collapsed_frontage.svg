<!-- One segment of a collapsed frontage: brick fallen into the street with a timber beam across
     it. Repeated across the width it obstructs, the way rubble.svg is for `burnt_shell` — but a
     picture of its own rather than that one, since no two rows may share a look
     (docs/EVENTS.md, "the visual vocabulary"). -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="30" viewBox="0 0 24 30" shape-rendering="geometricPrecision" stroke="#3b2d32" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round">
  <rect x="0" y="10" width="24" height="18" fill="#8a7a68"/>
  <rect x="0" y="10" width="24" height="3" fill="#a08e78"/>
  <rect x="3" y="14" width="5" height="4" fill="#6b5c4c"/>
  <rect x="11" y="16" width="5" height="4" fill="#6b5c4c"/>
  <rect x="17" y="13" width="5" height="4" fill="#6b5c4c"/>
  <rect x="1" y="6" width="22" height="4" fill="#7d6a52"/>
  <rect x="0" y="26" width="24" height="2" fill="#221f28"/>
</svg>
