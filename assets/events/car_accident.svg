     onlooker on each pavement. One continuous scene at native width 200, over the 192px this
     row obstructs, so `_draw_spread` draws exactly one copy — see fallen_tree.svg. The onlookers
     are person.svg's own figure at its own size, so they are the game's people and not a
     drawing of people; keep them in step with that file. -->
