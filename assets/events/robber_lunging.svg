<!-- The robber, coming. The same hood and the same colours, so it reads as the same man, and a
     posture that could not be mistaken for the other one at any distance: leaning out over a
     forward leg with an arm at full stretch. It is the `cat_crouched` / `cat_running` rule — the
     crouch *is* the telegraph, so the two silhouettes have to differ at a glance rather than by
     a scale factor — arriving at the one row where getting it wrong ends the day. -->
<svg xmlns="http://www.w3.org/2000/svg" width="34" height="44" viewBox="0 0 34 44" shape-rendering="crispEdges">
  <rect x="3" y="32" width="5" height="10" fill="#26262e"/>
  <rect x="14" y="34" width="9" height="4" fill="#26262e"/>
  <rect x="2" y="42" width="6" height="2" fill="#17171c"/>
  <rect x="20" y="38" width="6" height="2" fill="#17171c"/>
  <rect x="4" y="16" width="16" height="18" fill="#353a46"/>
  <rect x="4" y="28" width="16" height="6" fill="#2b303a"/>
  <rect x="19" y="18" width="12" height="5" fill="#2b303a"/>
  <circle cx="31" cy="21" r="3" fill="#d9a878"/>
  <rect x="5" y="13" width="16" height="6" fill="#2b303a"/>
  <circle cx="15" cy="9" r="7" fill="#2b303a"/>
  <circle cx="16" cy="10" r="4" fill="#141419"/>
</svg>
