<!-- The dog on the other end of the lead. Drawn low and braced, because the whole hazard is
     that it lunges: how dangerous a thing is has to be visible from looking at the thing. -->
<svg xmlns="http://www.w3.org/2000/svg" width="26" height="20" viewBox="0 0 26 20" shape-rendering="crispEdges">
  <rect x="4" y="16" width="3" height="4" fill="#3b2f26"/>
  <rect x="11" y="16" width="3" height="4" fill="#3b2f26"/>
  <rect x="3" y="8" width="14" height="8" fill="#6b543f"/>
  <rect x="15" y="4" width="7" height="7" fill="#6b543f"/>
  <rect x="15" y="2" width="3" height="3" fill="#3b2f26"/>
  <rect x="21" y="7" width="3" height="2" fill="#221f28"/>
  <rect x="0" y="6" width="4" height="3" fill="#6b543f"/>
</svg>
