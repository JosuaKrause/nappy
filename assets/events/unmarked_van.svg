<!-- The unmarked van. It idles at the kerb and getting close ends the run, and until M37 it drew
     the same picture as the delivery van parked two streets back — which is the whole of playtest
     07's finding 2 arriving at the one row where being told apart is the difference between a
     detour and losing the day.
     What makes it not a delivery van: no windows down the side, a blacked-out cab, no livery, and
     the side door standing open. It is the only vehicle in the game with a dark hole in it. -->
<svg xmlns="http://www.w3.org/2000/svg" width="50" height="32" viewBox="0 0 50 32" shape-rendering="crispEdges">
  <rect x="2" y="3" width="46" height="21" fill="#4a4e56"/>
  <rect x="2" y="3" width="46" height="3" fill="#5a5f68"/>
  <rect x="5" y="8" width="11" height="7" fill="#191b21"/>
  <rect x="26" y="6" width="15" height="16" fill="#141419"/>
  <rect x="41" y="6" width="4" height="16" fill="#3a3e46"/>
  <rect x="2" y="20" width="46" height="4" fill="#221f28"/>
  <circle cx="13" cy="27" r="5" fill="#26232a"/>
  <circle cx="38" cy="27" r="5" fill="#26232a"/>
  <circle cx="13" cy="27" r="2" fill="#3a373f"/>
  <circle cx="38" cy="27" r="2" fill="#3a373f"/>
