<!-- The post that caps each end of a blocking object. Cream with a red top, the same hazard
     family as `barrier_segment.svg`'s diagonal stripes — a post rather than a board, so it stays
     mostly structural and lets the repeated segments carry the warning. -->
<svg xmlns="http://www.w3.org/2000/svg" width="6" height="26" viewBox="0 0 6 26" shape-rendering="crispEdges">
  <rect x="0" y="0" width="6" height="26" fill="#e0d8c4"/>
  <rect x="0" y="0" width="6" height="4" fill="#c4503c"/>
  <rect x="4" y="0" width="2" height="26" fill="#c9c0a8"/>
  <rect x="0" y="24" width="6" height="2" fill="#221f28"/>
</svg>
