<!-- Stopped, turned to face the player, one arm up and her mouth open — the posture that is the
     whole telegraph: a capture is running for as long as this is what is drawn. Read against
     chatting_mother_walking.svg, which is what she looks like the rest of the time. The pram
     stands where it stopped; it is what she is not walking away from. -->
<svg xmlns="http://www.w3.org/2000/svg" width="54" height="46" viewBox="0 0 54 46" shape-rendering="crispEdges">
  <!-- the pram, stopped -->
  <path d="M26 20 L31 20 L26 29 L23 29 Z" fill="#4a3f2f"/>
  <path d="M26 19 A9 9 0 0 1 44 19 L44 24 L26 24 Z" fill="#cbb98f"/>
  <path d="M28 21 A7 7 0 0 1 42 21 L42 24 L28 24 Z" fill="#b8a67c"/>
  <rect x="25" y="24" width="27" height="11" fill="#6b5a42"/>
  <rect x="25" y="32" width="27" height="3" fill="#4a3f2f"/>
  <circle cx="30" cy="40" r="5" fill="#26232a"/>
  <circle cx="48" cy="40" r="5" fill="#26232a"/>
  <circle cx="30" cy="40" r="2" fill="#4a464f"/>
  <circle cx="48" cy="40" r="2" fill="#4a464f"/>
  <!-- her, turned to face the viewer -->
  <rect x="6" y="32" width="5" height="12" fill="#665f50"/>
  <rect x="13" y="32" width="5" height="12" fill="#5c5648"/>
  <rect x="5" y="44" width="7" height="2" fill="#2f2a2c"/>
  <rect x="13" y="44" width="7" height="2" fill="#2f2a2c"/>
  <rect x="4" y="13" width="16" height="20" fill="#5c7a52"/>
  <rect x="4" y="27" width="16" height="6" fill="#455e3d"/>
  <rect x="19" y="16" width="4" height="14" fill="#5c7a52"/>
  <rect x="19" y="28" width="4" height="3" fill="#d9a878"/>
  <!-- the raised arm: the gesture that reads as mid-sentence -->
  <rect x="0" y="2" width="4" height="16" fill="#5c7a52"/>
  <rect x="0" y="0" width="4" height="3" fill="#d9a878"/>
  <circle cx="12" cy="8" r="7" fill="#d9a878"/>
  <path d="M5 8 A7 7 0 0 1 19 8 Z" fill="#2f2a20"/>
  <rect x="9" y="8" width="2" height="2" fill="#221f28"/>
  <rect x="14" y="8" width="2" height="2" fill="#221f28"/>
  <rect x="10" y="11" width="4" height="2" fill="#221f28"/>
</svg>
