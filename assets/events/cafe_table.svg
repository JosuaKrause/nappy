<!-- One table and chair of a café spilling onto the pavement. Repeated across the width the
     event obstructs, so what is drawn is exactly what is in the way. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="26" viewBox="0 0 24 26" shape-rendering="crispEdges">
  <rect x="1" y="8" width="6" height="14" fill="#7a6a58"/>
  <rect x="1" y="6" width="6" height="3" fill="#9c8a72"/>
  <rect x="8" y="4" width="14" height="3" fill="#c96f4a"/>
  <rect x="14" y="7" width="2" height="17" fill="#5c5248"/>
  <rect x="9" y="23" width="12" height="3" fill="#5c5248"/>
</svg>
