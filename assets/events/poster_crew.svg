<!-- The poster crew. The event is that the walls change, so the thing to draw is the poster, not
     the man: he holds it up at head height with a paste brush in the other hand and a bucket at
     his feet. The overall is a colour nothing else in act II wears, because from a street away
     the poster is the only part that will read. -->
