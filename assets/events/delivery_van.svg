<!-- A delivery van at the kerb, seen from the side: shutter up at the back, hazards on. This was
     `vehicle.svg` and it was drawn for *every* VEHICLE event until M37 — a fire engine, a police
     car, a riot van, an army truck and the unmarked van that takes the baby were all this
     picture. The colour is baked rather than modulated: multiplying would tint the tyres and the
     windscreen too. -->
