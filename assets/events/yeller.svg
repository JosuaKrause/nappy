<!-- The man shouting. Read against `person.svg`, which is what he used to be: a long coat down
     to the boots instead of a shirt and trousers, a raised arm, and a beard. The coat is the
     load-bearing part — it takes the split between two legs out of the silhouette, so he is one
     solid shape at a distance where an ordinary passer-by is two. -->
