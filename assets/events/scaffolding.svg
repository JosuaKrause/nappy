  <rect x="2" y="2" width="3" height="34" fill="#8a8478"/>
  <rect x="17" y="2" width="3" height="34" fill="#8a8478"/>
  <rect x="0" y="6" width="22" height="3" fill="#a8a294"/>
  <rect x="0" y="20" width="22" height="3" fill="#a8a294"/>
  <rect x="2" y="22" width="18" height="10" fill="#c9b98a"/>
  <rect x="2" y="22" width="18" height="2" fill="#ded0a4"/>
</svg>
