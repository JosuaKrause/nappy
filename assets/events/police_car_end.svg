<!-- The police car seen along its length, for the north-south corridors. One sprite serves both
     directions: at this angle the front and the back of a patrol car are the same box, and the
     light bar is the one detail that has to survive at this width. Read against police_car.svg —
     same paint, same bar, a quarter of the frontage. -->
<svg xmlns="http://www.w3.org/2000/svg" width="26" height="42" viewBox="0 0 26 42" shape-rendering="crispEdges">
  <rect x="3" y="6" width="20" height="28" fill="#d8dde4"/>
  <rect x="3" y="6" width="20" height="3" fill="#e6ebf1"/>
  <rect x="5" y="9" width="16" height="5" fill="#3a4a66"/>
  <rect x="5" y="26" width="16" height="5" fill="#3a4a66"/>
  <rect x="5" y="16" width="16" height="4" fill="#3a3f4a"/>
  <rect x="6" y="17" width="6" height="2" fill="#4a7fc4"/>
  <rect x="14" y="17" width="6" height="2" fill="#c4503c"/>
  <rect x="3" y="31" width="20" height="3" fill="#221f28"/>
  <rect x="1" y="12" width="3" height="16" fill="#26232a"/>
  <rect x="22" y="12" width="3" height="16" fill="#26232a"/>
</svg>
