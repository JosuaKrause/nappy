<!-- One segment of a barricade: a tyre, a chair and a sheet of corrugated iron, stacked by
     somebody rather than delivered. Repeated across the width it closes.
     It is the act IV answer to `checkpoint_block.svg` and the two are meant to be told apart at a
     glance: a checkpoint is poured concrete and a barricade is whatever was on the street. Both
     used to be the same municipal barrier, which said the wrong thing about who put it there. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="30" viewBox="0 0 24 30" shape-rendering="crispEdges">
  <rect x="1" y="6" width="10" height="12" fill="#7a6a58"/>
  <rect x="1" y="6" width="10" height="3" fill="#9c8a72"/>
  <rect x="3" y="10" width="2" height="8" fill="#5c5248"/>
  <rect x="12" y="10" width="11" height="10" fill="#5f6b70"/>
  <rect x="14" y="10" width="2" height="10" fill="#7d8a90"/>
  <rect x="18" y="10" width="2" height="10" fill="#7d8a90"/>
  <rect x="0" y="18" width="24" height="4" fill="#4a423c"/>
  <circle cx="7" cy="24" r="5" fill="#26232a"/>
  <circle cx="7" cy="24" r="2" fill="#4a464f"/>
  <rect x="13" y="20" width="10" height="8" fill="#6b543f"/>
  <rect x="0" y="28" width="24" height="2" fill="#221f28"/>
</svg>
