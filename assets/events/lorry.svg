  <rect x="4" y="12" width="36" height="18" fill="#6b7a8c"/>
  <rect x="2" y="30" width="40" height="4" fill="#3b3f4a"/>
  <rect x="3" y="14" width="6" height="6" fill="#e8ddc8"/>
  <rect x="3" y="24" width="6" height="6" fill="#e8ddc8"/>
