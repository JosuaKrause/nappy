<!-- A box lorry reversing across the pavement into a yard. Deliberately the biggest thing in
     act I and deliberately *rectangular*: the danger is the blind side of a wall of metal, so
     the silhouette is a wall. The reversing lights are on the tail, which is the end that is
     coming towards you. -->
