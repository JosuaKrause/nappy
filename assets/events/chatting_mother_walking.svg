  <circle cx="12" cy="8" r="7" fill="#d9a878"/>
  <path d="M5 8 A7 7 0 0 1 16 3 L16 12 Z" fill="#2f2a20"/>
  <rect x="15" y="8" width="2" height="2" fill="#221f28"/>
