<!-- One segment of a burnt-out shell: charred brick, a fallen lintel, and nothing behind the
     window holes. Repeated across the width the event obstructs, like every other spread, so
     what is drawn is exactly what is in the way.
     It used to be drawn with `barrier_segment.svg`, i.e. as roadworks — a scar that has been on
     that corner since day 3 rendered as a crew who had just turned up. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="30" viewBox="0 0 24 30" shape-rendering="crispEdges">
  <rect x="0" y="4" width="24" height="24" fill="#3e3a38"/>
  <rect x="0" y="4" width="24" height="3" fill="#4c4744"/>
  <rect x="3" y="10" width="7" height="8" fill="#1b1a1c"/>
  <rect x="14" y="10" width="7" height="8" fill="#1b1a1c"/>
  <rect x="0" y="20" width="24" height="2" fill="#2c2a2a"/>
  <rect x="2" y="24" width="8" height="4" fill="#514a45"/>
  <rect x="13" y="25" width="9" height="3" fill="#514a45"/>
  <rect x="0" y="28" width="24" height="2" fill="#221f28"/>
</svg>
