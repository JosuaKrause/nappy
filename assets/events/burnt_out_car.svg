  <path d="M10 8 Q24 5 34 8 L33 13 L11 13 Z" fill="#1b1a1c"/>
  <rect x="4" y="20" width="40" height="2" fill="#2c2a2a"/>
  <circle cx="12" cy="23" r="4" fill="#1b1a1c"/>
  <circle cx="36" cy="23" r="4" fill="#1b1a1c"/>
  <path d="M14 10 L18 16 M22 9 L26 16 M30 9 L33 15" stroke="#514a45" stroke-width="1"/>
</svg>
