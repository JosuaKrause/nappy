<!-- A hard seal, vehicle scale: a car burnt to the shell, in the same charred palette as
     rubble.svg — `burnt_shell`'s own colours moved onto a vehicle body rather than a frontage.
     `SealPlanner._hard_positions` spaces several of these across a street's width the way it
     spaces `barricade`, so the picture is a pile-up rather than one wide scene. -->
