<!-- One pigeon on the upstroke. Paired with `pigeon_down.svg`, which is the same bird with its
     wings under it: a flock is drawn as N of these, each on its own beat, so what shows is a
     dozen individual birds rather than one shape repeated. -->

<svg xmlns="http://www.w3.org/2000/svg" width="18" height="14" viewBox="0 0 18 14" shape-rendering="crispEdges">
  <rect x="5" y="7" width="8" height="4" fill="#6b7a8c"/>
  <rect x="12" y="5" width="4" height="4" fill="#6b7a8c"/>
  <rect x="15" y="6" width="2" height="2" fill="#e8b64a"/>
  <rect x="3" y="2" width="6" height="4" fill="#8a97a8"/>
  <rect x="9" y="0" width="5" height="3" fill="#8a97a8"/>
  <rect x="1" y="8" width="4" height="2" fill="#5c697a"/>
  <rect x="7" y="11" width="2" height="2" fill="#c4503c"/>
</svg>
