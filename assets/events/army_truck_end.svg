<!-- The convoy truck seen along its length. The ribbed tilt is the side view's silhouette and it
     is edge-on here, so what has to carry the row is the canvas back itself: an olive box with an
     open, darker mouth where the fire engine has a red one and the patrol car a pale one. -->
<svg xmlns="http://www.w3.org/2000/svg" width="34" height="50" viewBox="0 0 34 50" shape-rendering="crispEdges">
  <rect x="3" y="4" width="28" height="36" fill="#5f6b47"/>
  <rect x="3" y="4" width="28" height="3" fill="#75825a"/>
  <rect x="6" y="8" width="22" height="4" fill="#2f3630"/>
  <rect x="6" y="22" width="22" height="16" fill="#4a5438"/>
  <rect x="8" y="24" width="18" height="12" fill="#2f3630"/>
  <rect x="3" y="38" width="28" height="3" fill="#221f28"/>
  <rect x="1" y="12" width="3" height="24" fill="#26232a"/>
  <rect x="30" y="12" width="3" height="24" fill="#26232a"/>
</svg>
